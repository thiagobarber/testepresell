<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manual Práctico de Cejas</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #FFFFFF;
      color: #1A1A1A;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 48px 20px;
    }
    .container {
      width: 100%;
      max-width: 800px;
      text-align: center;
    }
    h1 {
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 28px;
      color: #1A1A1A;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      margin-bottom: 28px;
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(135deg, #1a1a1a 0%, #3a3a3a 100%);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: none;
      background: #FFFFFF;
      color: #1A1A1A;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      z-index: 2;
    }
    .play-button:hover {
      transform: translate(-50%, -50%) scale(1.06);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.3);
    }
    .play-button:focus-visible {
      outline: 3px solid #FFFFFF;
      outline-offset: 4px;
    }
    .play-button svg {
      width: 34px;
      height: 34px;
      margin-left: 4px;
    }
    .subheadline {
      font-size: clamp(16px, 2.4vw, 20px);
      font-weight: 400;
      line-height: 1.6;
      color: #444444;
      margin-bottom: 32px;
      max-width: 680px;
      margin-left: auto;
      margin-right: auto;
    }
    .cta {
      display: inline-block;
      background: #1A1A1A;
      color: #FFFFFF;
      font-family: 'Poppins', sans-serif;
      font-size: 18px;
      font-weight: 600;
      text-decoration: none;
      padding: 16px 40px;
      border-radius: 8px;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .cta:hover {
      background: #333333;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Manual Práctico: Cejas Perfectas Paso a Paso</h1>

    <div class="video-wrapper" id="videoWrapper">
      <button class="play-button" id="playButton" aria-label="Reproducir video">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>
    </div>

    <p class="subheadline">Aprende las técnicas esenciales para diseñar cejas impecables con este curso en formato de manual práctico, fácil de seguir y aplicar desde el primer día.</p>

    <a class="cta" href="https://pay.kiwify.com/o6cmojy" target="_blank" rel="noopener noreferrer">¡Quiero Mi Manual Ahora!</a>
  </div>
  <script>
    const playButton = document.getElementById('playButton');
    const videoWrapper = document.getElementById('videoWrapper');
    playButton.addEventListener('click', function () {
      const iframe = document.createElement('iframe');
      iframe.src = 'https://www.canva.com/design/DAHbveqKQZw/2AYXlGZfUalBuTGPnp1prw/watch?embed&autoplay=1';
      iframe.title = 'Video del Manual Práctico de Cejas';
      iframe.setAttribute('allow', 'autoplay; fullscreen');
      iframe.setAttribute('allowfullscreen', '');
      iframe.loading = 'lazy';
      videoWrapper.innerHTML = '';
      videoWrapper.appendChild(iframe);
    });
  </script>
</body>
</html>

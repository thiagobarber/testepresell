<!DOCTYPE html>
<html lang="es-ES">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aura Finance | Planificación Financiera Personal</title>
  
  <!-- Tipografía Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      background-color: #f8fafc;
      color: #0f172a;
      overflow-x: hidden;
    }
    .dark body {
      background-color: #0b1120;
      color: #f8fafc;
    }
    /* Animación de pulso para el tutorial */
    @keyframes spotlight-pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      50% { transform: scale(1.03); box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); }
    }
    .tutorial-highlight {
      animation: spotlight-pulse 2s infinite;
      z-index: 50;
      position: relative;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-[#0B1120] text-slate-800 dark:text-slate-100 transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // =========================================================================
    // UTILIDADES Y FORMATEO ESPAÑOL DE ESPAÑA
    // =========================================================================
    const formatEUR = (amount) => {
      const val = Number(amount) || 0;
      return new Intl.NumberFormat('es-ES', {
        style: 'currency',
        currency: 'EUR',
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      }).format(val);
    };

    const formatDateES = (dateStr) => {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      return new Intl.DateTimeFormat('es-ES', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      }).format(d);
    };

    const CATEGORIES = {
      housing: { name: 'Vivienda', icon: '🏠' },
      food: { name: 'Alimentación', icon: '🍔' },
      transport: { name: 'Transporte', icon: '🚗' },
      leisure: { name: 'Ocio', icon: '🎮' },
      subscriptions: { name: 'Suscripciones', icon: '💳' },
      health: { name: 'Salud', icon: '🏥' },
      education: { name: 'Educación', icon: '📚' },
      shopping: { name: 'Compras', icon: '🛍' },
      savings: { name: 'Ahorro', icon: '💰' },
      investment: { name: 'Inversión', icon: '📈' },
      debt: { name: 'Deudas', icon: '⚖️' },
      salary: { name: 'Nómina / Salario', icon: '💼' },
      extra: { name: 'Ingresos extras', icon: '✨' }
    };

    // =========================================================================
    // ESTRUCTURA DE DATOS LIMPIA (SIN NINGÚN DATO FICTICIO)
    // =========================================================================
    const STORAGE_KEY = 'aura_finance_real_data_v2';

    const INITIAL_CLEAN_DATA = {
      user: {
        name: 'Usuario',
        email: '',
        tutorialCompleted: false
      },
      transactions: [],
      budgets: [],
      goals: [],
      debts: [],
      investments: [],
      habits: [
        { id: 'h_1', title: 'Registrar los gastos del día', streak: 0, completedToday: false },
        { id: 'h_2', title: 'Revisar suscripciones mensuales', streak: 0, completedToday: false },
        { id: 'h_3', title: 'Aportar al ahorro al recibir ingresos', streak: 0, completedToday: false }
      ]
    };

    const db = {
      get: () => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(INITIAL_CLEAN_DATA));
            return INITIAL_CLEAN_DATA;
          }
          return JSON.parse(raw);
        } catch (e) {
          return INITIAL_CLEAN_DATA;
        }
      },
      set: (data) => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e) {
          console.error(e);
        }
      },
      reset: () => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(INITIAL_CLEAN_DATA));
        return INITIAL_CLEAN_DATA;
      }
    };

    // Componente Icono
    const Icon = ({ name, size = 18, className = "" }) => {
      const containerRef = useRef(null);
      useEffect(() => {
        if (window.lucide && containerRef.current) {
          containerRef.current.innerHTML = `<i data-lucide="${name}" class="${className}" style="width:${size}px; height:${size}px;"></i>`;
          window.lucide.createIcons({ root: containerRef.current });
        }
      }, [name, size, className]);
      return <span ref={containerRef} className={`inline-flex items-center justify-center align-middle ${className}`} />;
    };

    const Card = ({ children, className = "", title, subtitle, action }) => (
      <div className={`bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-5 md:p-6 shadow-sm ${className}`}>
        {(title || action) && (
          <div className="flex items-center justify-between mb-4">
            <div>
              {title && <h3 className="font-semibold text-slate-900 dark:text-white text-base">{title}</h3>}
              {subtitle && <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">{subtitle}</p>}
            </div>
            {action && <div>{action}</div>}
          </div>
        )}
        {children}
      </div>
    );

    const Button = ({ children, variant = "primary", size = "md", onClick, disabled, className = "", type = "button", icon }) => {
      const base = "inline-flex items-center justify-center font-medium rounded-xl transition-all duration-150 focus:outline-none disabled:opacity-50";
      const sizes = {
        sm: "px-3 py-1.5 text-xs gap-1.5",
        md: "px-4 py-2 text-sm gap-2",
        lg: "px-5 py-2.5 text-base gap-2"
      };
      const variants = {
        primary: "bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm shadow-emerald-600/20 active:scale-[0.98]",
        secondary: "bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200",
        outline: "border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800/60 text-slate-700 dark:text-slate-300",
        danger: "bg-rose-600 hover:bg-rose-700 text-white"
      };
      return (
        <button type={type} onClick={onClick} disabled={disabled} className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}>
          {icon && <Icon name={icon} size={size === 'sm' ? 14 : size === 'lg' ? 18 : 16} />}
          {children}
        </button>
      );
    };

    const ProgressBar = ({ value, max, color = "bg-emerald-500" }) => {
      const pct = max > 0 ? Math.min(100, Math.max(0, Math.round((value / max) * 100))) : 0;
      return (
        <div className="w-full bg-slate-100 dark:bg-slate-800 h-2 rounded-full overflow-hidden">
          <div className={`h-full ${color} rounded-full transition-all duration-300`} style={{ width: `${pct}%` }} />
        </div>
      );
    };

    const Modal = ({ isOpen, onClose, title, children }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="fixed inset-0" onClick={onClose}></div>
          <div className="relative bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-lg p-6 shadow-2xl z-10">
            <div className="flex items-center justify-between pb-3 mb-4 border-b border-slate-100 dark:border-slate-800">
              <h3 className="text-lg font-bold text-slate-900 dark:text-white">{title}</h3>
              <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-slate-600">
                <Icon name="x" size={18} />
              </button>
            </div>
            {children}
          </div>
        </div>
      );
    };

    // =========================================================================
    // TUTORIAL GUIADO INTERACTIVO (PRIMER ACCESO)
    // =========================================================================
    const TutorialModal = ({ step, onNext, onSkip }) => {
      const steps = [
        {
          title: "Bienvenido a tu Espacio Financiero",
          desc: "Esta aplicación está 100% limpia para que introduzcas tus números reales. No hay datos ficticios ni simulaciones prefabricadas. Tú tienes el control total.",
          icon: "sparkles",
          actionText: "Iniciar recorrido (1 min)"
        },
        {
          title: "1. Registra tus movimientos reales",
          desc: "Haz clic en el botón '+ Añadir' en cualquier momento para registrar tu nómina, compras o recibos. Todas las gráficas y métricas se construirán exclusivamente con lo que tú introduzcas.",
          icon: "plus-circle",
          actionText: "Siguiente: Presupuestos"
        },
        {
          title: "2. Define tus propios presupuestos",
          desc: "En la sección 'Presupuestos' puedes establecer el límite máximo que deseas gastar cada mes en alimentación, ocio, transporte o vivienda. La app te avisará si te acercas al tope.",
          icon: "pie-chart",
          actionText: "Siguiente: Tus Objetivos"
        },
        {
          title: "3. Crea tus metas y objetivos reales",
          desc: "Indica qué quieres conseguir (ej. Fondo de emergencia, compra de vivienda o un viaje). La aplicación calculará cuánto debes ahorrar al mes según tu plazo, sin estimaciones inventadas.",
          icon: "target",
          actionText: "Siguiente: Simuladores"
        },
        {
          title: "4. Simuladores y Calculadoras",
          desc: "Utiliza las calculadoras de interés compuesto y amortización de deudas con tus datos reales para saber exactamente cuándo liquidarás préstamos o cuánto crecerá tu ahorro.",
          icon: "calculator",
          actionText: "¡Empezar a planificar!"
        }
      ];

      const current = steps[step];

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-xs">
          <div className="relative bg-white dark:bg-slate-900 border-2 border-emerald-500 rounded-3xl w-full max-w-md p-6 sm:p-8 shadow-2xl text-center animate-in fade-in duration-200">
            <div className="w-14 h-14 rounded-2xl bg-emerald-100 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 flex items-center justify-center mx-auto mb-4">
              <Icon name={current.icon} size={28} />
            </div>

            <span className="text-xs font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400 block mb-1">
              Guía de primer acceso • Paso {step + 1} de {steps.length}
            </span>

            <h3 className="text-xl font-bold text-slate-900 dark:text-white mb-2">{current.title}</h3>
            <p className="text-sm text-slate-600 dark:text-slate-300 leading-relaxed mb-6">{current.desc}</p>

            <div className="flex items-center justify-between gap-3">
              <button
                type="button"
                onClick={onSkip}
                className="text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
              >
                Saltar tutorial
              </button>
              <Button variant="primary" size="md" onClick={onNext}>
                {current.actionText} <Icon name="chevron-right" size={16} />
              </Button>
            </div>
          </div>
        </div>
      );
    };

    // =========================================================================
    // VISTA PRINCIPAL (DASHBOARD REAL)
    // =========================================================================
    const DashboardView = ({ data, onOpenAdd, onNavigate }) => {
      const income = data.transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
      const expense = data.transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
      const netSavings = income - expense;
      const savingsRate = income > 0 ? ((netSavings / income) * 100).toFixed(1) : "0,0";

      const totalInvested = data.investments.reduce((s, i) => s + i.current, 0);
      const totalDebts = data.debts.reduce((s, d) => s + d.remaining, 0);
      const totalInGoals = data.goals.reduce((s, g) => s + g.current, 0);
      const netWorth = (totalInGoals + totalInvested) - totalDebts;

      const hasTransactions = data.transactions.length > 0;

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-2 border-b border-slate-200 dark:border-slate-800">
            <div>
              <h1 className="text-2xl font-bold text-slate-900 dark:text-white">Panel de Control</h1>
              <p className="text-sm text-slate-500">Tus finanzas reales organizadas en tiempo real.</p>
            </div>
            <Button variant="primary" size="sm" onClick={onOpenAdd} icon="plus">
              + Añadir movimiento
            </Button>
          </div>

          {/* Métricas Principales */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <Card>
              <p className="text-xs font-semibold uppercase tracking-wider text-slate-400">Patrimonio Neto</p>
              <p className="text-2xl font-bold text-slate-900 dark:text-white mt-1">{formatEUR(netWorth)}</p>
              <p className="text-xs text-slate-400 mt-1">Ahorro + Inversión - Deudas</p>
            </Card>

            <Card>
              <p className="text-xs font-semibold uppercase tracking-wider text-slate-400">Ingresos Registrados</p>
              <p className="text-2xl font-bold text-emerald-600 mt-1">+{formatEUR(income)}</p>
              <p className="text-xs text-slate-400 mt-1">{data.transactions.filter(t => t.type === 'income').length} ingresos</p>
            </Card>

            <Card>
              <p className="text-xs font-semibold uppercase tracking-wider text-slate-400">Gastos Registrados</p>
              <p className="text-2xl font-bold text-slate-900 dark:text-white mt-1">-{formatEUR(expense)}</p>
              <p className="text-xs text-slate-400 mt-1">{data.transactions.filter(t => t.type === 'expense').length} gastos</p>
            </Card>

            <Card>
              <p className="text-xs font-semibold uppercase tracking-wider text-slate-400">Ahorro Neto</p>
              <p className={`text-2xl font-bold mt-1 ${netSavings >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                {formatEUR(netSavings)}
              </p>
              <p className="text-xs text-slate-400 mt-1">Tasa de ahorro: {savingsRate}%</p>
            </Card>
          </div>

          {/* Si no hay datos, mostrar guía de arranque */}
          {!hasTransactions && (
            <div className="p-8 border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-3xl text-center bg-white dark:bg-slate-900/50">
              <div className="w-12 h-12 rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 mx-auto flex items-center justify-center mb-3">
                <Icon name="inbox" size={24} />
              </div>
              <h3 className="font-bold text-lg text-slate-900 dark:text-white">Aún no has registrado ningún movimiento</h3>
              <p className="text-sm text-slate-500 max-w-md mx-auto mt-1 mb-5">
                Empieza añadiendo tu salario o tu primer gasto mensual para ver el balance automático.
              </p>
              <Button variant="primary" onClick={onOpenAdd} icon="plus">
                Registrar primer movimiento
              </Button>
            </div>
          )}

          {/* Tablas / Resumen cuando ya hay datos */}
          {hasTransactions && (
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <Card title="Últimos movimientos registrados">
                <div className="divide-y divide-slate-100 dark:divide-slate-800">
                  {data.transactions.slice(0, 5).map(t => (
                    <div key={t.id} className="py-3 flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <span className="text-xl p-2 rounded-xl bg-slate-50 dark:bg-slate-800">
                          {CATEGORIES[t.category]?.icon || '🏷️'}
                        </span>
                        <div>
                          <p className="text-sm font-semibold text-slate-900 dark:text-white">{t.concept}</p>
                          <p className="text-xs text-slate-400">{CATEGORIES[t.category]?.name} • {formatDateES(t.date)}</p>
                        </div>
                      </div>
                      <span className={`text-sm font-bold ${t.type === 'income' ? 'text-emerald-600' : 'text-slate-900 dark:text-white'}`}>
                        {t.type === 'income' ? '+' : '-'}{formatEUR(t.amount)}
                      </span>
                    </div>
                  ))}
                </div>
              </Card>

              <Card title="Tus Objetivos Financieros">
                {data.goals.length === 0 ? (
                  <div className="text-center py-8">
                    <p className="text-xs text-slate-400 mb-3">No tienes objetivos creados.</p>
                    <Button variant="outline" size="sm" onClick={() => onNavigate('objetivos')} icon="plus">
                      Crear mi primer objetivo
                    </Button>
                  </div>
                ) : (
                  <div className="space-y-4">
                    {data.goals.map(g => (
                      <div key={g.id} className="p-3 bg-slate-50 dark:bg-slate-800/40 rounded-xl border border-slate-100 dark:border-slate-800">
                        <div className="flex justify-between text-xs font-semibold mb-1">
                          <span>{g.name}</span>
                          <span>{formatEUR(g.current)} de {formatEUR(g.target)}</span>
                        </div>
                        <ProgressBar value={g.current} max={g.target} />
                      </div>
                    ))}
                  </div>
                )}
              </Card>
            </div>
          )}
        </div>
      );
    };

    // =========================================================================
    // VISTA: MOVIMIENTOS (CRUD COMPLETO)
    // =========================================================================
    const TransactionsView = ({ data, onOpenAdd, onDeleteTx }) => (
      <div className="space-y-6">
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-2 border-b border-slate-200 dark:border-slate-800">
          <div>
            <h1 className="text-2xl font-bold text-slate-900 dark:text-white">Movimientos</h1>
            <p className="text-sm text-slate-500">Tus transacciones introducidas manualmente.</p>
          </div>
          <Button variant="primary" size="sm" onClick={onOpenAdd} icon="plus">
            + Nuevo movimiento
          </Button>
        </div>

        <Card className="p-0! overflow-hidden">
          <div className="overflow-x-auto">
            <table className="w-full text-left text-sm">
              <thead className="bg-slate-50 dark:bg-slate-800/60 border-b border-slate-200 dark:border-slate-800 text-xs text-slate-400 uppercase font-semibold">
                <tr>
                  <th className="py-3 px-4">Fecha</th>
                  <th className="py-3 px-4">Concepto</th>
                  <th className="py-3 px-4">Categoría</th>
                  <th className="py-3 px-4 text-right">Importe</th>
                  <th className="py-3 px-4 text-center">Acción</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                {data.transactions.length === 0 ? (
                  <tr>
                    <td colSpan="5" className="py-12 text-center text-slate-400 text-sm">
                      Sin movimientos todavía. Haz clic en "+ Nuevo movimiento".
                    </td>
                  </tr>
                ) : (
                  data.transactions.map(t => (
                    <tr key={t.id} className="hover:bg-slate-50/50 dark:hover:bg-slate-800/40">
                      <td className="py-3 px-4 text-xs text-slate-500">{formatDateES(t.date)}</td>
                      <td className="py-3 px-4 font-semibold text-slate-900 dark:text-white">{t.concept}</td>
                      <td className="py-3 px-4 text-xs">
                        <span className="inline-flex items-center gap-1.5 px-2 py-1 rounded-md bg-slate-100 dark:bg-slate-800">
                          {CATEGORIES[t.category]?.icon} {CATEGORIES[t.category]?.name}
                        </span>
                      </td>
                      <td className={`py-3 px-4 text-right font-bold ${t.type === 'income' ? 'text-emerald-600' : 'text-slate-900 dark:text-white'}`}>
                        {t.type === 'income' ? '+' : '-'}{formatEUR(t.amount)}
                      </td>
                      <td className="py-3 px-4 text-center">
                        <button
                          onClick={() => onDeleteTx(t.id)}
                          className="p-1 text-slate-400 hover:text-rose-600"
                          title="Eliminar"
                        >
                          <Icon name="trash-2" size={16} />
                        </button>
                      </td>
                    </tr>
                  ))
                )}
              </tbody>
            </table>
          </div>
        </Card>
      </div>
    );

    // =========================================================================
    // VISTA: PRESUPUESTOS (EL USUARIO CREA SUS PROPIOS LÍMITES)
    // =========================================================================
    const BudgetsView = ({ data, onAddBudget, onDeleteBudget }) => {
      const [showModal, setShowModal] = useState(false);
      const [newBudget, setNewBudget] = useState({ category: 'food', limit: 300 });

      // Calcular gasto real por categoría
      const spentMap = useMemo(() => {
        const res = {};
        data.transactions.filter(t => t.type === 'expense').forEach(t => {
          res[t.category] = (res[t.category] || 0) + t.amount;
        });
        return res;
      }, [data.transactions]);

      const handleCreate = (e) => {
        e.preventDefault();
        onAddBudget({ category: newBudget.category, limit: Number(newBudget.limit) });
        setShowModal(false);
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-2 border-b border-slate-200 dark:border-slate-800">
            <div>
              <h1 className="text-2xl font-bold text-slate-900 dark:text-white">Presupuestos</h1>
              <p className="text-sm text-slate-500">Crea tus propios límites de gasto mensual por categoría.</p>
            </div>
            <Button variant="primary" size="sm" onClick={() => setShowModal(true)} icon="plus">
              + Definir límite
            </Button>
          </div>

          {data.budgets.length === 0 ? (
            <div className="p-8 border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-3xl text-center bg-white dark:bg-slate-900/50">
              <p className="text-sm text-slate-500 mb-4">No has establecido ningún presupuesto aún.</p>
              <Button variant="outline" size="sm" onClick={() => setShowModal(true)} icon="plus">
                Crear mi primer presupuesto
              </Button>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {data.budgets.map(b => {
                const spent = spentMap[b.category] || 0;
                const cat = CATEGORIES[b.category] || { name: b.category, icon: '🏷️' };
                const isOver = spent > b.limit;

                return (
                  <Card key={b.category} className={isOver ? 'border-rose-400' : ''}>
                    <div className="flex items-center justify-between mb-2">
                      <div className="flex items-center gap-2">
                        <span className="text-2xl">{cat.icon}</span>
                        <div>
                          <h4 className="font-semibold text-slate-900 dark:text-white">{cat.name}</h4>
                          <p className="text-xs text-slate-400">Límite fijado: {formatEUR(b.limit)}</p>
                        </div>
                      </div>
                      <div className="flex items-center gap-3">
                        <div className="text-right">
                          <p className={`font-bold text-sm ${isOver ? 'text-rose-600' : 'text-slate-900 dark:text-white'}`}>{formatEUR(spent)}</p>
                          <span className="text-[11px] text-slate-400">de {formatEUR(b.limit)}</span>
                        </div>
                        <button onClick={() => onDeleteBudget(b.category)} className="text-slate-300 hover:text-rose-600 p-1">
                          <Icon name="x" size={16} />
                        </button>
                      </div>
                    </div>
                    <ProgressBar value={spent} max={b.limit} color={isOver ? 'bg-rose-500' : 'bg-emerald-500'} />
                  </Card>
                );
              })}
            </div>
          )}

          {/* Modal Definir Presupuesto */}
          <Modal isOpen={showModal} onClose={() => setShowModal(false)} title="Fijar presupuesto mensual">
            <form onSubmit={handleCreate} className="space-y-4">
              <div>
                <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Categoría</label>
                <select
                  className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"
                  value={newBudget.category}
                  onChange={(e) => setNewBudget({ ...newBudget, category: e.target.value })}
                >
                  {Object.entries(CATEGORIES).map(([k, v]) => (
                    <option key={k} value={k}>{v.icon} {v.name}</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Límite mensual en euros (€)</label>
                <input
                  type="number"
                  required
                  placeholder="300"
                  className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"
                  value={newBudget.limit}
                  onChange={(e) => setNewBudget({ ...newBudget, limit: e.target.value })}
                />
              </div>

              <div className="flex justify-end gap-2 pt-2">
                <Button variant="outline" size="sm" onClick={() => setShowModal(false)}>Cancelar</Button>
                <Button variant="primary" size="sm" type="submit">Guardar límite</Button>
              </div>
            </form>
          </Modal>
        </div>
      );
    };

    // =========================================================================
    // VISTA: OBJETIVOS (EL USUARIO DEFINE SUS METAS)
    // =========================================================================
    const GoalsView = ({ data, onAddGoal, onDepositGoal, onDeleteGoal }) => {
      const [showModal, setShowModal] = useState(false);
      const [goalForm, setGoalForm] = useState({
        name: '',
        target: 2000,
        current: 0,
        deadline: '2027-12-31'
      });

      const handleCreate = (e) => {
        e.preventDefault();
        if (!goalForm.name) return;
        onAddGoal({
          id: 'goal_' + Date.now(),
          name: goalForm.name,
          target: Number(goalForm.target),
          current: Number(goalForm.current),
          deadline: goalForm.deadline
        });
        setShowModal(false);
        if (window.confetti) window.confetti({ particleCount: 50 });
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-2 border-b border-slate-200 dark:border-slate-800">
            <div>
              <h1 className="text-2xl font-bold text-slate-900 dark:text-white">Mis Objetivos</h1>
              <p className="text-sm text-slate-500">Planifica tus propias metas de ahorro e inversión.</p>
            </div>
            <Button variant="primary" size="sm" onClick={() => setShowModal(true)} icon="plus">
              + Crear objetivo
            </Button>
          </div>

          {data.goals.length === 0 ? (
            <div className="p-8 border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-3xl text-center bg-white dark:bg-slate-900/50">
              <p className="text-sm text-slate-500 mb-4">No tienes ningún objetivo fijado todavía.</p>
              <Button variant="outline" size="sm" onClick={() => setShowModal(true)} icon="plus">
                Crear mi primer objetivo
              </Button>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {data.goals.map(g => {
                const remaining = Math.max(0, g.target - g.current);
                const deadlineDate = new Date(g.deadline);
                const now = new Date();
                const diffMonths = Math.max(1, Math.round((deadlineDate - now) / (1000 * 60 * 60 * 24 * 30.4)));
                const monthlyRequired = Math.round(remaining / diffMonths);

                return (
                  <Card key={g.id}>
                    <div className="flex justify-between items-start mb-2">
                      <div>
                        <h4 className="font-bold text-slate-900 dark:text-white text-base">{g.name}</h4>
                        <p className="text-xs text-slate-400">Fecha objetivo: {formatDateES(g.deadline)} ({diffMonths} meses)</p>
                      </div>
                      <button onClick={() => onDeleteGoal(g.id)} className="text-slate-300 hover:text-rose-600 p-1">
                        <Icon name="trash-2" size={16} />
                      </button>
                    </div>

                    <div className="my-3">
                      <div className="flex justify-between text-xs mb-1">
                        <span className="font-bold text-slate-900 dark:text-white">{formatEUR(g.current)}</span>
                        <span className="text-slate-400">Meta: {formatEUR(g.target)}</span>
                      </div>
                      <ProgressBar value={g.current} max={g.target} />
                    </div>

                    <div className="flex justify-between items-center text-xs mt-4 pt-3 border-t border-slate-100 dark:border-slate-800">
                      <span className="text-slate-500">
                        Ahorro necesario: <strong className="text-emerald-600">{formatEUR(monthlyRequired)}/mes</strong>
                      </span>
                      <Button
                        variant="secondary"
                        size="sm"
                        onClick={() => {
                          const dep = prompt(`¿Cuánto dinero quieres aportar hoy a "${g.name}"? (€):`, "50");
                          if (dep && !isNaN(dep) && Number(dep) > 0) {
                            onDepositGoal(g.id, Number(dep));
                            if (window.confetti) window.confetti({ particleCount: 40 });
                          }
                        }}
                      >
                        + Aportar
                      </Button>
                    </div>
                  </Card>
                );
              })}
            </div>
          )}

          {/* Modal Crear Objetivo */}
          <Modal isOpen={showModal} onClose={() => setShowModal(false)} title="Nuevo objetivo">
            <form onSubmit={handleCreate} className="space-y-4">
              <div>
                <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Nombre</label>
                <input
                  type="text"
                  required
                  placeholder="Ej: Fondo de emergencia, Viaje, Entrada piso..."
                  className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"
                  value={goalForm.name}
                  onChange={(e) => setGoalForm({ ...goalForm, name: e.target.value })}
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Meta total (€)</label>
                  <input
                    type="number"
                    required
                    placeholder="3000"
                    className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"
                    value={goalForm.target}
                    onChange={(e) => setGoalForm({ ...goalForm, target: e.target.value })}
                  />
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Ahorro inicial (€)</label>
                  <input
                    type="number"
                    placeholder="0"
                    className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"
                    value={goalForm.current}
                    onChange={(e) => setGoalForm({ ...goalForm, current: e.target.value })}
                  />
                </div>
              </div>

              <div>
                <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Fecha límite</label>
                <input
                  type="date"
                  required
                  className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"
                  value={goalForm.deadline}
                  onChange={(e) => setGoalForm({ ...goalForm, deadline: e.target.value })}
                />
              </div>

              <div className="flex justify-end gap-2 pt-2">
                <Button variant="outline" size="sm" onClick={() => setShowModal(false)}>Cancelar</Button>
                <Button variant="primary" size="sm" type="submit">Guardar objetivo</Button>
              </div>
            </form>
          </Modal>
        </div>
      );
    };

    // =========================================================================
    // VISTA: CALCULADORAS INTERACTIVAS
    // =========================================================================
    const CalculatorsView = () => {
      const [principal, setPrincipal] = useState(1000);
      const [monthly, setMonthly] = useState(150);
      const [rate, setRate] = useState(6);
      const [years, setYears] = useState(10);

      const compoundResult = useMemo(() => {
        const r = rate / 100 / 12;
        const n = years * 12;
        let total = principal;
        let invested = principal;

        for (let i = 0; i < n; i++) {
          total = (total + monthly) * (1 + r);
          invested += monthly;
        }

        return {
          final: total,
          invested,
          interest: Math.max(0, total - invested)
        };
      }, [principal, monthly, rate, years]);

      return (
        <div className="space-y-6">
          <div className="pb-2 border-b border-slate-200 dark:border-slate-800">
            <h1 className="text-2xl font-bold text-slate-900 dark:text-white">Calculadoras Financieras</h1>
            <p className="text-sm text-slate-500">Cálculos matemáticos puros para tus proyecciones personales.</p>
          </div>

          <Card title="Calculadora de Interés Compuesto">
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-4">
              <div className="space-y-4">
                <div>
                  <div className="flex justify-between text-xs font-semibold mb-1">
                    <span>Aportación inicial</span>
                    <span className="text-emerald-600 font-bold">{formatEUR(principal)}</span>
                  </div>
                  <input
                    type="range"
                    min="0"
                    max="20000"
                    step="250"
                    value={principal}
                    onChange={(e) => setPrincipal(Number(e.target.value))}
                    className="w-full accent-emerald-600"
                  />
                </div>

                <div>
                  <div className="flex justify-between text-xs font-semibold mb-1">
                    <span>Aportación mensual</span>
                    <span className="text-emerald-600 font-bold">{formatEUR(monthly)} / mes</span>
                  </div>
                  <input
                    type="range"
                    min="0"
                    max="1500"
                    step="25"
                    value={monthly}
                    onChange={(e) => setMonthly(Number(e.target.value))}
                    className="w-full accent-emerald-600"
                  />
                </div>

                <div>
                  <div className="flex justify-between text-xs font-semibold mb-1">
                    <span>Rentabilidad anual esperada</span>
                    <span className="text-emerald-600 font-bold">{rate} % anual</span>
                  </div>
                  <input
                    type="range"
                    min="1"
                    max="15"
                    step="0.5"
                    value={rate}
                    onChange={(e) => setRate(Number(e.target.value))}
                    className="w-full accent-emerald-600"
                  />
                </div>

                <div>
                  <div className="flex justify-between text-xs font-semibold mb-1">
                    <span>Horizonte temporal</span>
                    <span className="text-emerald-600 font-bold">{years} años</span>
                  </div>
                  <input
                    type="range"
                    min="1"
                    max="35"
                    step="1"
                    value={years}
                    onChange={(e) => setYears(Number(e.target.value))}
                    className="w-full accent-emerald-600"
                  />
                </div>
              </div>

              <div className="p-6 bg-slate-50 dark:bg-slate-800/60 rounded-2xl border border-slate-200 dark:border-slate-700 flex flex-col justify-between">
                <div>
                  <p className="text-xs uppercase font-semibold text-slate-400">Capital final estimado</p>
                  <p className="text-3xl font-extrabold text-slate-900 dark:text-white mt-1">
                    {formatEUR(compoundResult.final)}
                  </p>

                  <div className="mt-4 space-y-2 text-xs">
                    <div className="flex justify-between">
                      <span className="text-slate-500">Capital aportado:</span>
                      <span className="font-semibold text-slate-800 dark:text-slate-200">{formatEUR(compoundResult.invested)}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-500">Intereses generados:</span>
                      <span className="font-bold text-emerald-600">+{formatEUR(compoundResult.interest)}</span>
                    </div>
                  </div>
                </div>

                <p className="text-[11px] text-slate-400 mt-4 border-t border-slate-200 dark:border-slate-700 pt-3">
                  Los rendimientos de inversión son hipotéticos y no garantizan resultados reales de mercado.
                </p>
              </div>
            </div>
          </Card>
        </div>
      );
    };

    // =========================================================================
    // VISTA: PERFIL Y CONFIGURACIÓN (CON REPETICIÓN DEL TUTORIAL)
    // =========================================================================
    const ProfileView = ({ onStartTutorial, onClearAll }) => (
      <div className="space-y-6 max-w-2xl">
        <div className="pb-2 border-b border-slate-200 dark:border-slate-800">
          <h1 className="text-2xl font-bold text-slate-900 dark:text-white">Perfil & Ajustes</h1>
          <p className="text-sm text-slate-500">Configuración de la cuenta y ayuda interactiva.</p>
        </div>

        <Card title="Tutorial de Uso">
          <p className="text-xs text-slate-500 mb-4">
            ¿Quieres volver a ver las explicaciones sobre cómo usar la aplicación y organizar tus finanzas?
          </p>
          <Button variant="outline" size="sm" onClick={onStartTutorial} icon="help-circle">
            Repetir tutorial interactivo
          </Button>
        </Card>

        <Card title="Gestión de Datos">
          <p className="text-xs text-slate-500 mb-4">
            Si deseas reiniciar completamente tu cuenta y borrar todos los movimientos y presupuestos introducidos:
          </p>
          <Button
            variant="danger"
            size="sm"
            onClick={() => {
              if (confirm("¿Estás seguro de que deseas vaciar todos tus datos personales registrados?")) {
                onClearAll();
              }
            }}
            icon="trash-2"
          >
            Borrar todos mis datos
          </Button>
        </Card>
      </div>
    );

    // =========================================================================
    // COMPONENTE PRINCIPAL (ORQUESTADOR)
    // =========================================================================
    const App = () => {
      const [appData, setAppData] = useState(() => db.get());
      const [view, setView] = useState('dashboard'); // 'dashboard' | 'movimientos' | 'presupuesto' | 'objetivos' | 'calculadoras' | 'perfil'
      const [isAddOpen, setIsAddOpen] = useState(false);
      
      // Estado del tutorial
      const [tutorialActive, setTutorialActive] = useState(() => !appData.user.tutorialCompleted);
      const [tutorialStep, setTutorialStep] = useState(0);

      // Estado del formulario de nuevo movimiento
      const [txForm, setTxForm] = useState({
        concept: '',
        amount: '',
        type: 'expense',
        category: 'food'
      });

      useEffect(() => {
        db.set(appData);
      }, [appData]);

      const handleAddTx = (e) => {
        e.preventDefault();
        if (!txForm.concept || !txForm.amount) return;

        const newEntry = {
          id: 'tx_' + Date.now(),
          concept: txForm.concept,
          amount: parseFloat(txForm.amount),
          type: txForm.type,
          category: txForm.category,
          date: new Date().toISOString().slice(0, 10)
        };

        setAppData(prev => ({
          ...prev,
          transactions: [newEntry, ...prev.transactions]
        }));

        setTxForm({ concept: '', amount: '', type: 'expense', category: 'food' });
        setIsAddOpen(false);
      };

      const handleDeleteTx = (id) => {
        setAppData(prev => ({
          ...prev,
          transactions: prev.transactions.filter(t => t.id !== id)
        }));
      };

      const handleAddBudget = (b) => {
        setAppData(prev => ({
          ...prev,
          budgets: [...prev.budgets.filter(x => x.category !== b.category), b]
        }));
      };

      const handleDeleteBudget = (cat) => {
        setAppData(prev => ({
          ...prev,
          budgets: prev.budgets.filter(x => x.category !== cat)
        }));
      };

      const handleAddGoal = (g) => {
        setAppData(prev => ({
          ...prev,
          goals: [g, ...prev.goals]
        }));
      };

      const handleDepositGoal = (id, amt) => {
        setAppData(prev => ({
          ...prev,
          goals: prev.goals.map(g => g.id === id ? { ...g, current: g.current + amt } : g)
        }));
      };

      const handleDeleteGoal = (id) => {
        setAppData(prev => ({
          ...prev,
          goals: prev.goals.filter(g => g.id !== id)
        }));
      };

      const handleNextTutorial = () => {
        if (tutorialStep < 4) {
          setTutorialStep(s => s + 1);
        } else {
          setTutorialActive(false);
          setAppData(prev => ({
            ...prev,
            user: { ...prev.user, tutorialCompleted: true }
          }));
        }
      };

      const handleSkipTutorial = () => {
        setTutorialActive(false);
        setAppData(prev => ({
          ...prev,
          user: { ...prev.user, tutorialCompleted: true }
        }));
      };

      const handleRestartTutorial = () => {
        setTutorialStep(0);
        setTutorialActive(true);
      };

      const handleClearAll = () => {
        const fresh = db.reset();
        setAppData(fresh);
        setTutorialStep(0);
        setTutorialActive(true);
      };

      const NAV = [
        { id: 'dashboard', label: 'Inicio', icon: 'layout-dashboard' },
        { id: 'movimientos', label: 'Movimientos', icon: 'arrow-left-right' },
        { id: 'presupuesto', label: 'Presupuestos', icon: 'pie-chart' },
        { id: 'objetivos', label: 'Mis Objetivos', icon: 'target' },
        { id: 'calculadoras', label: 'Calculadoras', icon: 'calculator' },
        { id: 'perfil', label: 'Ajustes', icon: 'settings' }
      ];

      return (
        <div className="min-h-screen flex flex-col md:flex-row">
          {/* Modal Tutorial Inicial */}
          {tutorialActive && (
            <TutorialModal
              step={tutorialStep}
              onNext={handleNextTutorial}
              onSkip={handleSkipTutorial}
            />
          )}

          {/* SIDEBAR DESKTOP */}
          <aside className="hidden md:flex flex-col w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 p-5 shrink-0 select-none">
            <div className="flex items-center gap-2.5 pb-6 border-b border-slate-100 dark:border-slate-800">
              <div className="w-8 h-8 rounded-xl bg-emerald-600 text-white flex items-center justify-center font-bold">
                <Icon name="shield-check" size={18} />
              </div>
              <span className="font-bold text-slate-900 dark:text-white text-base">Aura Finance</span>
            </div>

            <div className="my-5">
              <Button
                variant="primary"
                className="w-full py-2.5 shadow-sm shadow-emerald-600/20"
                onClick={() => setIsAddOpen(true)}
                icon="plus"
              >
                + Añadir
              </Button>
            </div>

            <nav className="space-y-1 flex-1">
              {NAV.map(item => (
                <button
                  key={item.id}
                  onClick={() => setView(item.id)}
                  className={`w-full flex items-center gap-3 px-3 py-2 rounded-xl text-sm font-medium transition-colors ${view === item.id ? 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-400 font-semibold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800'}`}
                >
                  <Icon name={item.icon} size={18} />
                  <span>{item.label}</span>
                </button>
              ))}
            </nav>

            <button
              onClick={handleRestartTutorial}
              className="flex items-center gap-2 text-xs text-slate-400 hover:text-emerald-600 pt-4 border-t border-slate-100 dark:border-slate-800"
            >
              <Icon name="help-circle" size={16} />
              <span>Ver tutorial de nuevo</span>
            </button>
          </aside>

          {/* CONTENIDO PRINCIPAL */}
          <main className="flex-1 flex flex-col min-w-0 pb-20 md:pb-8">
            {/* Header móvil */}
            <div className="md:hidden flex items-center justify-between p-4 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-30">
              <div className="flex items-center gap-2">
                <div className="w-7 h-7 rounded-lg bg-emerald-600 text-white flex items-center justify-center font-bold">
                  <Icon name="shield-check" size={16} />
                </div>
                <span className="font-bold text-slate-900 dark:text-white">Aura Finance</span>
              </div>
              <Button variant="primary" size="sm" onClick={() => setIsAddOpen(true)} icon="plus">
                Añadir
              </Button>
            </div>

            <div className="p-4 sm:p-6 lg:p-8 max-w-5xl mx-auto w-full">
              {view === 'dashboard' && <DashboardView data={appData} onOpenAdd={() => setIsAddOpen(true)} onNavigate={setView} />}
              {view === 'movimientos' && <TransactionsView data={appData} onOpenAdd={() => setIsAddOpen(true)} onDeleteTx={handleDeleteTx} />}
              {view === 'presupuesto' && <BudgetsView data={appData} onAddBudget={handleAddBudget} onDeleteBudget={handleDeleteBudget} />}
              {view === 'objetivos' && <GoalsView data={appData} onAddGoal={handleAddGoal} onDepositGoal={handleDepositGoal} onDeleteGoal={handleDeleteGoal} />}
              {view === 'calculadoras' && <CalculatorsView />}
              {view === 'perfil' && <ProfileView onStartTutorial={handleRestartTutorial} onClearAll={handleClearAll} />}
            </div>
          </main>

          {/* NAVEGACIÓN INFERIOR MÓVIL */}
          <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 px-4 py-2 flex items-center justify-around z-40">
            <button onClick={() => setView('dashboard')} className={`flex flex-col items-center text-[11px] ${view === 'dashboard' ? 'text-emerald-600 font-bold' : 'text-slate-400'}`}>
              <Icon name="layout-dashboard" size={18} />
              <span>Inicio</span>
            </button>
            <button onClick={() => setView('movimientos')} className={`flex flex-col items-center text-[11px] ${view === 'movimientos' ? 'text-emerald-600 font-bold' : 'text-slate-400'}`}>
              <Icon name="arrow-left-right" size={18} />
              <span>Movimientos</span>
            </button>
            <button
              onClick={() => setIsAddOpen(true)}
              className="w-11 h-11 -mt-5 rounded-full bg-emerald-600 text-white flex items-center justify-center shadow-lg active:scale-95"
            >
              <Icon name="plus" size={22} />
            </button>
            <button onClick={() => setView('objetivos')} className={`flex flex-col items-center text-[11px] ${view === 'objetivos' ? 'text-emerald-600 font-bold' : 'text-slate-400'}`}>
              <Icon name="target" size={18} />
              <span>Objetivos</span>
            </button>
            <button onClick={() => setView('perfil')} className={`flex flex-col items-center text-[11px] ${view === 'perfil' ? 'text-emerald-600 font-bold' : 'text-slate-400'}`}>
              <Icon name="settings" size={18} />
              <span>Ajustes</span>
            </button>
          </div>

          {/* MODAL GLOBAL (+ AÑADIR) */}
          <Modal isOpen={isAddOpen} onClose={() => setIsAddOpen(false)} title="Registrar movimiento real">
            <form onSubmit={handleAddTx} className="space-y-4">
              <div className="flex gap-2">
                <button
                  type="button"
                  onClick={() => setTxForm({ ...txForm, type: 'expense' })}
                  className={`flex-1 py-2 text-xs font-semibold rounded-xl border ${txForm.type === 'expense' ? 'bg-rose-50 border-rose-500 text-rose-700' : 'border-slate-200 dark:border-slate-800'}`}
                >
                  Gasto
                </button>
                <button
                  type="button"
                  onClick={() => setTxForm({ ...txForm, type: 'income' })}
                  className={`flex-1 py-2 text-xs font-semibold rounded-xl border ${txForm.type === 'income' ? 'bg-emerald-50 border-emerald-500 text-emerald-700' : 'border-slate-200 dark:border-slate-800'}`}
                >
                  Ingreso
                </button>
              </div>

              <div>
                <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Concepto</label>
                <input
                  type="text"
                  required
                  placeholder="Ej: Nómina, Compra supermercado, Gasolina..."
                  className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"
                  value={txForm.concept}
                  onChange={(e) => setTxForm({ ...txForm, concept: e.target.value })}
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Importe (€)</label>
                  <input
                    type="number"
                    step="0.01"
                    required
                    placeholder="0,00"
                    className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"
                    value={txForm.amount}
                    onChange={(e) => setTxForm({ ...txForm, amount: e.target.value })}
                  />
                </div>

                <div>
                  <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Categoría</label>
                  <select
                    className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"
                    value={txForm.category}
                    onChange={(e) => setTxForm({ ...txForm, category: e.target.value })}
                  >
                    {Object.entries(CATEGORIES).map(([k, v]) => (
                      <option key={k} value={k}>{v.icon} {v.name}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div className="flex justify-end gap-2 pt-2">
                <Button variant="outline" size="sm" onClick={() => setIsAddOpen(false)}>Cancelar</Button>
                <Button variant="primary" size="sm" type="submit">Guardar movimiento</Button>
              </div>
            </form>
          </Modal>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manual Práctico de Cejas</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: #FFFFFF;
      color: #1A1A1A;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100svh;
      padding: 40px 16px;
      overflow-x: hidden;
    }
    .container {
      width: 100%;
      max-width: 800px;
      text-align: center;
    }
    h1 {
      font-size: clamp(26px, 6vw, 44px);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 24px;
      color: #1A1A1A;
      overflow-wrap: break-word;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 9 / 16;
      margin: 0 auto 24px;
      border-radius: 14px;
      overflow: hidden;
      background: linear-gradient(135deg, #1a1a1a 0%, #3a3a3a 100%);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: none;
      background: #FFFFFF;
      color: #1A1A1A;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      z-index: 2;
      -webkit-tap-highlight-color: transparent;
    }
    .play-button:hover {
      transform: translate(-50%, -50%) scale(1.06);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.3);
    }
    .play-button:active {
      transform: translate(-50%, -50%) scale(0.98);
    }
    .play-button:focus-visible {
      outline: 3px solid #FFFFFF;
      outline-offset: 4px;
    }
    .play-button svg {
      width: 32px;
      height: 32px;
      margin-left: 4px;
    }
    .subheadline {
      font-size: clamp(15px, 3.8vw, 20px);
      font-weight: 400;
      line-height: 1.65;
      color: #444444;
      margin: 0 auto 28px;
      max-width: 680px;
      overflow-wrap: break-word;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #1A1A1A;
      color: #FFFFFF;
      font-family: 'Poppins', sans-serif;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.3;
      text-decoration: none;
      padding: 16px 32px;
      border-radius: 10px;
      min-height: 56px;
      width: min(100%, 360px);
      transition: background 0.2s ease, transform 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .cta:hover {
      background: #333333;
      transform: translateY(-1px);
    }
    .cta:active {
      transform: translateY(0);
    }
    @media (max-width: 480px) {
      body {
        padding: 28px 16px;
        align-items: flex-start;
      }
      .container {
        padding-top: 8px;
      }
      h1 {
        margin-bottom: 20px;
      }
      .video-wrapper {
        max-width: 360px;
        margin: 0 auto 20px;
        border-radius: 12px;
      }
      .play-button {
        width: 72px;
        height: 72px;
      }
      .play-button svg {
        width: 28px;
        height: 28px;
        margin-left: 3px;
      }
      .subheadline {
        margin-bottom: 24px;
      }
      .cta {
        width: 100%;
        font-size: 16px;
        padding: 16px 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Manual Práctico: Cejas Perfectas Paso a Paso</h1>

    <div class="video-wrapper" id="videoWrapper">
      <button class="play-button" id="playButton" aria-label="Reproducir video">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>
    </div>

    <p class="subheadline">Aprende las técnicas esenciales para diseñar cejas impecables con este curso en formato de manual práctico, fácil de seguir y aplicar desde el primer día.</p>

    <a class="cta" href="https://pay.kiwify.com/o6cmojy" target="_blank" rel="noopener noreferrer">¡Quiero Mi Manual Ahora!</a>
  </div>
  <script>
    const playButton = document.getElementById('playButton');
    const videoWrapper = document.getElementById('videoWrapper');
    playButton.addEventListener('click', function () {
      const iframe = document.createElement('iframe');
      iframe.src = 'https://www.canva.com/design/DAHbveqKQZw/2AYXlGZfUalBuTGPnp1prw/watch?embed&autoplay=1';
      iframe.title = 'Video del Manual Práctico de Cejas';
      iframe.setAttribute('allow', 'autoplay; fullscreen');
      iframe.setAttribute('allowfullscreen', '');
      iframe.loading = 'lazy';
      iframe.style.position = 'absolute';
      iframe.style.top = '-7%';
      iframe.style.left = '0';
      iframe.style.width = '100%';
      iframe.style.height = '114%';
      iframe.style.border = '0';
      videoWrapper.innerHTML = '';
      videoWrapper.appendChild(iframe);
    });
  </script>
</body>
</html>

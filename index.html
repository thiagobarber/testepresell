      );
    };

    // =========================================================================
    // 9. COMPONENTE DASHBOARD PRINCIPAL Y GRÁFICOS
    // =========================================================================
    const DashboardView = ({ data, onNavigate, onOpenQuickAdd }) => {
      const expensesChartRef = useRef(null);
      const cashflowChartRef = useRef(null);
      const chartInstance1 = useRef(null);
      const chartInstance2 = useRef(null);

      const health = useMemo(() => calculateFinancialHealth(data), [data]);

      // Métricas clave calculadas en tiempo real
      const metrics = useMemo(() => {
        const income = data.transactions
          .filter(t => t.type === 'income')
          .reduce((sum, t) => sum + t.amount, 0);

        const expense = data.transactions
          .filter(t => t.type === 'expense')
          .reduce((sum, t) => sum + t.amount, 0);

        const netSavings = income - expense;
        const totalInvested = data.investments.reduce((sum, i) => sum + i.current, 0);
        const totalDebts = data.debts.reduce((sum, d) => sum + d.remaining, 0);
        const liquidSavings = data.goals.reduce((sum, g) => sum + g.current, 0);

        // Patrimonio neto = Liquidez objetivos + Inversiones - Deudas
        const netWorth = (liquidSavings + totalInvested) - totalDebts;

        return {
          income,
          expense,
          netSavings,
          netWorth,
          savingsRate: income > 0 ? ((netSavings / income) * 100).toFixed(1) : 0
        };
      }, [data]);

      // Gráficos Chart.js
      useEffect(() => {
        // 1. Gráfico circular de categorías de gasto
        if (expensesChartRef.current) {
          const categoryTotals = {};
          data.transactions
            .filter(t => t.type === 'expense')
            .forEach(t => {
              const catName = CATEGORIES[t.category]?.name || 'Otros';
              categoryTotals[catName] = (categoryTotals[catName] || 0) + t.amount;
            });

          const labels = Object.keys(categoryTotals);
          const values = Object.values(categoryTotals);

          if (chartInstance1.current) chartInstance1.current.destroy();

          chartInstance1.current = new Chart(expensesChartRef.current, {
            type: 'doughnut',
            data: {
              labels: labels.length ? labels : ['Sin datos'],
              datasets: [{
                data: values.length ? values : [1],
                backgroundColor: [
                  '#10B981', '#3B82F6', '#F59E0B', '#EC4899', '#8B5CF6', '#EF4444', '#06B6D4'
                ],
                borderWidth: 0
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } }
              },
              cutout: '70%'
            }
          });
        }

        // 2. Gráfico de flujo de dinero (Semestral simulado con el mes actual sincronizado)
        if (cashflowChartRef.current) {
          if (chartInstance2.current) chartInstance2.current.destroy();

          const months = ['Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre'];
          const incomeData = [2700, 2750, 3100, 2800, 2850, metrics.income];
          const expenseData = [1850, 1920, 2200, 2050, 1980, metrics.expense];

          chartInstance2.current = new Chart(cashflowChartRef.current, {
            type: 'bar',
            data: {
              labels: months,
              datasets: [
                {
                  label: 'Ingresos (€)',
                  data: incomeData,
                  backgroundColor: '#10B981',
                  borderRadius: 6
                },
                {
                  label: 'Gastos (€)',
                  data: expenseData,
                  backgroundColor: '#94A3B8',
                  borderRadius: 6
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: 'top', align: 'end', labels: { boxWidth: 12, font: { size: 11 } } }
              },
              scales: {
                y: {
                  beginAtZero: true,
                  grid: { color: 'rgba(226, 232, 240, 0.4)' },
                  ticks: { font: { size: 10 } }
                },
                x: {
                  grid: { display: false },
                  ticks: { font: { size: 10 } }
                }
              }
            }
          });
        }

        return () => {
          if (chartInstance1.current) chartInstance1.current.destroy();
          if (chartInstance2.current) chartInstance2.current.destroy();
        };
      }, [data, metrics]);

      return (
        <div className="space-y-6">
          {/* Header del Dashboard */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-2 border-b border-slate-200/80 dark:border-slate-800">
            <div>
              <h1 className="text-2xl lg:text-3xl font-bold tracking-tight text-slate-900 dark:text-white">
                Buenos días, {data.user.name} 👋
              </h1>
              <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">
                Esto es lo que está pasando con tu dinero en este momento.
              </p>
            </div>
            <div className="flex items-center gap-2.5">
              <Button variant="outline" size="sm" onClick={() => onNavigate('movimientos')} icon="list">
                Ver movimientos
              </Button>
              <Button variant="primary" size="sm" onClick={onOpenQuickAdd} icon="plus">
                Añadir movimiento
              </Button>
            </div>
          </div>

          {/* Tarjetas métricas superiores */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <StatCard
              title="Patrimonio Neto"
              value={formatEUR(metrics.netWorth)}
              detail="Activos menos pasivos"
              icon="wallet"
              trend="up"
              trendValue="+4,2 % este mes"
            />
            <StatCard
              title="Ingresos del Mes"
              value={formatEUR(metrics.income)}
              detail="Nómina y rentas auxiliares"
              icon="arrow-down-left"
              trend="up"
              trendValue="En línea"
            />
            <StatCard
              title="Gastos del Mes"
              value={formatEUR(metrics.expense)}
              detail="Consumo fijo y variable"
              icon="arrow-up-right"
              trend="down"
              trendValue="-3,1 % vs anterior"
            />
            <StatCard
              title="Ahorro Generado"
              value={formatEUR(metrics.netSavings)}
              detail={`Tasa de ahorro: ${metrics.savingsRate} %`}
              icon="piggy-bank"
              trend="up"
              trendValue="Objetivo >20%"
            />
          </div>

          {/* Fila: Health Score Financiero + Gráfico de Gastos */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* Widget Health Score */}
            <Card
              title="Salud Financiera 360°"
              subtitle="Puntuación dinámica calculada por tus datos"
              action={
                <span className="px-2.5 py-1 text-xs font-bold rounded-full bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300">
                  {health.badge}
                </span>
              }
              className="lg:col-span-1 flex flex-col justify-between"
            >
              <div className="flex items-center justify-center my-4">
                <div className="relative flex items-center justify-center">
                  <svg className="w-36 h-36 transform -rotate-90">
                    <circle cx="72" cy="72" r="58" stroke="currentColor" strokeWidth="10" className="text-slate-100 dark:text-slate-800" fill="transparent" />
                    <circle
                      cx="72"
                      cy="72"
                      r="58"
                      stroke="currentColor"
                      strokeWidth="10"
                      className="text-emerald-500 transition-all duration-1000 ease-out"
                      fill="transparent"
                      strokeDasharray="364.4"
                      strokeDashoffset={364.4 - (364.4 * health.score) / 100}
                      strokeLinecap="round"
                    />
                  </svg>
                  <div className="absolute flex flex-col items-center">
                    <span className="text-3xl font-extrabold text-slate-900 dark:text-white">{health.score}</span>
                    <span className="text-xs text-slate-400 font-medium">de 100</span>
                  </div>
                </div>
              </div>

              <div className="p-3 bg-slate-50 dark:bg-slate-800/60 rounded-xl text-xs text-slate-600 dark:text-slate-300 mb-4">
                <p className="font-semibold text-slate-800 dark:text-slate-100 mb-1">Diagnóstico:</p>
                <p>{health.message}</p>
              </div>

              <div className="space-y-2 text-xs">
                <div className="flex justify-between text-slate-500">
                  <span>Tasa de ahorro ({health.savingsRate}%)</span>
                  <span className="font-semibold text-slate-800 dark:text-slate-200">{health.savingsScore}/30 pts</span>
                </div>
                <div className="flex justify-between text-slate-500">
                  <span>Fondo de emergencia</span>
                  <span className="font-semibold text-slate-800 dark:text-slate-200">{health.emergencyScore}/25 pts</span>
                </div>
                <div className="flex justify-between text-slate-500">
                  <span>Carga de deudas</span>
                  <span className="font-semibold text-slate-800 dark:text-slate-200">{health.debtScore}/25 pts</span>
                </div>
                <div className="flex justify-between text-slate-500">
                  <span>Inversión y diversificación</span>
                  <span className="font-semibold text-slate-800 dark:text-slate-200">{health.investScore}/20 pts</span>
                </div>
              </div>
            </Card>

            {/* Gráfico circular de distribución de gastos */}
            <Card
              title="Gastos de este mes por categoría"
              subtitle="Reparto del consumo devengado"
              className="lg:col-span-2"
              action={
                <Button variant="ghost" size="sm" onClick={() => onNavigate('presupuesto')}>
                  Ver presupuestos
                </Button>
              }
            >
              <div className="h-64 relative">
                <canvas ref={expensesChartRef}></canvas>
              </div>
            </Card>
          </div>

          {/* Gráfico Flujo semestral */}
          <Card
            title="Flujo de dinero (Últimos 6 meses)"
            subtitle="Ingresos vs Gastos devengados mensuales"
          >
            <div className="h-72">
              <canvas ref={cashflowChartRef}></canvas>
            </div>
          </Card>

          {/* Objetivos prioritarios + Últimos movimientos */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            {/* Resumen de objetivos */}
            <Card
              title="Objetivos prioritarios"
              subtitle="Tu progreso hacia tus grandes metas"
              action={<Button variant="ghost" size="sm" onClick={() => onNavigate('objetivos')}>Ver todos</Button>}
            >
              <div className="space-y-4">
                {data.goals.slice(0, 3).map(goal => (
                  <div key={goal.id} className="p-3.5 rounded-xl border border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/30">
                    <div className="flex items-center justify-between mb-2">
                      <div className="flex items-center gap-2">
                        <span className="text-xl">{goal.icon || '🎯'}</span>
                        <div>
                          <p className="text-sm font-semibold text-slate-900 dark:text-white">{goal.name}</p>
                          <p className="text-xs text-slate-400">Meta: {formatDateES(goal.deadline)}</p>
                        </div>
                      </div>
                      <span className="text-xs font-bold text-slate-700 dark:text-slate-200">
                        {formatEUR(goal.current)} / {formatEUR(goal.target)}
                      </span>
                    </div>
                    <ProgressBar value={goal.current} max={goal.target} />
                  </div>
                ))}
              </div>
            </Card>

            {/* Últimos movimientos */}
            <Card
              title="Últimos movimientos registrados"
              subtitle="Transacciones recientes en tus cuentas"
              action={<Button variant="ghost" size="sm" onClick={() => onNavigate('movimientos')}>Ver extracto</Button>}
            >
              <div className="divide-y divide-slate-100 dark:divide-slate-800">
                {data.transactions.slice(0, 5).map(tx => {
                  const cat = CATEGORIES[tx.category] || { name: tx.category, icon: '🏷️' };
                  return (
                    <div key={tx.id} className="py-3 flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <span className="text-xl p-2 rounded-xl bg-slate-50 dark:bg-slate-800">{cat.icon}</span>
                        <div>
                          <p className="text-sm font-medium text-slate-900 dark:text-white">{tx.concept}</p>
                          <p className="text-xs text-slate-400">{cat.name} • {formatDateES(tx.date)}</p>
                        </div>
                      </div>
                      <span className={`text-sm font-bold ${tx.type === 'income' ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-900 dark:text-white'}`}>
                        {tx.type === 'income' ? '+' : '-'}{formatEUR(tx.amount)}
                      </span>
                    </div>
                  );
                })}
              </div>
            </Card>
          </div>
        </div>
      );
    };

    // =========================================================================
    // 10. MOVIMIENTOS (TRANSACCIONES CRUD)
    // =========================================================================
    const TransactionsView = ({ data, onAddTx, onDeleteTx }) => {
      const [filterType, setFilterType] = useState('all');
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all');

      const filtered = useMemo(() => {
        return data.transactions.filter(tx => {
          const matchesType = filterType === 'all' || tx.type === filterType;
          const matchesSearch = tx.concept.toLowerCase().includes(searchTerm.toLowerCase()) || (tx.notes && tx.notes.toLowerCase().includes(searchTerm.toLowerCase()));
          const matchesCat = selectedCategory === 'all' || tx.category === selectedCategory;
          return matchesType && matchesSearch && matchesCat;
        });
      }, [data.transactions, filterType, searchTerm, selectedCategory]);

      const exportCSV = () => {
        const headers = ['Fecha', 'Concepto', 'Tipo', 'Categoría', 'Cuenta', 'Importe EUR', 'Notas'];
        const rows = filtered.map(t => [
          t.date,
          `"${t.concept.replace(/"/g, '""')}"`,
          t.type === 'income' ? 'Ingreso' : 'Gasto',
          CATEGORIES[t.category]?.name || t.category,
          `"${t.account || ''}"`,
          t.amount,
          `"${(t.notes || '').replace(/"/g, '""')}"`
        ]);
        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(';'), ...rows.map(e => e.join(';'))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `movimientos_aura_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-2 border-b border-slate-200 dark:border-slate-800">
            <div>
              <h1 className="text-2xl font-bold text-slate-900 dark:text-white">Movimientos</h1>
              <p className="text-sm text-slate-500">Historial completo y categorizado de tus ingresos y gastos.</p>
            </div>
            <div className="flex gap-2">
              <Button variant="outline" size="sm" onClick={exportCSV} icon="download">Exportar CSV</Button>
              <Button variant="primary" size="sm" onClick={onAddTx} icon="plus">Nuevo movimiento</Button>
            </div>
          </div>

          {/* Filtros de búsqueda */}
          <div className="flex flex-col md:flex-row gap-3">
            <div className="relative flex-1">
              <input
                type="text"
                placeholder="Buscar por concepto o notas..."
                className="w-full pl-9 pr-4 py-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl text-sm"
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
              />
              <span className="absolute left-3 top-2.5 text-slate-400">
                <Icon name="search" size={16} />
              </span>
            </div>

            <div className="flex gap-2">
              <select
                className="px-3 py-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl text-sm"
                value={filterType}
                onChange={(e) => setFilterType(e.target.value)}
              >
                <option value="all">Todos los flujos</option>
                <option value="income">Solo Ingresos</option>
                <option value="expense">Solo Gastos</option>
              </select>

              <select
                className="px-3 py-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl text-sm"
                value={selectedCategory}
                onChange={(e) => setSelectedCategory(e.target.value)}
              >
                <option value="all">Todas las categorías</option>
                {Object.entries(CATEGORIES).map(([k, v]) => (
                  <option key={k} value={k}>{v.icon} {v.name}</option>
                ))}
              </select>
            </div>
          </div>

          {/* Tabla de movimientos */}
          <Card className="overflow-hidden p-0!">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-sm">
                <thead className="bg-slate-50 dark:bg-slate-800/70 border-b border-slate-200 dark:border-slate-800 text-xs text-slate-400 uppercase font-semibold">
                  <tr>
                    <th className="py-3.5 px-4">Fecha</th>
                    <th className="py-3.5 px-4">Concepto</th>
                    <th className="py-3.5 px-4">Categoría</th>
                    <th className="py-3.5 px-4">Cuenta / Método</th>
                    <th className="py-3.5 px-4 text-right">Importe</th>
                    <th className="py-3.5 px-4 text-center">Acciones</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                  {filtered.length === 0 ? (
                    <tr>
                      <td colSpan="6" className="py-12 text-center text-slate-400">
                        No se encontraron movimientos con los filtros seleccionados.
                      </td>
                    </tr>
                  ) : (
                    filtered.map(tx => {
                      const cat = CATEGORIES[tx.category] || { name: tx.category, icon: '🏷️' };
                      return (
                        <tr key={tx.id} className="hover:bg-slate-50/60 dark:hover:bg-slate-800/40 transition-colors">
                          <td className="py-3 px-4 text-xs text-slate-500 whitespace-nowrap">
                            {formatDateES(tx.date)}
                          </td>
                          <td className="py-3 px-4 font-medium text-slate-900 dark:text-white">
                            <div>{tx.concept}</div>
                            {tx.notes && <div className="text-xs text-slate-400">{tx.notes}</div>}
                          </td>
                          <td className="py-3 px-4 whitespace-nowrap">
                            <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-xs text-slate-700 dark:text-slate-300">
                              <span>{cat.icon}</span> {cat.name}
                            </span>
                          </td>
                          <td className="py-3 px-4 text-xs text-slate-500 whitespace-nowrap">
                            {tx.account || 'Principal'}
                          </td>
                          <td className={`py-3 px-4 text-right font-bold whitespace-nowrap ${tx.type === 'income' ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-900 dark:text-white'}`}>
                            {tx.type === 'income' ? '+' : '-'}{formatEUR(tx.amount)}
                          </td>
                          <td className="py-3 px-4 text-center">
                            <button
                              onClick={() => {
                                if (confirm(`¿Eliminar definitivamente "${tx.concept}"?`)) {
                                  onDeleteTx(tx.id);
                                }
                              }}
                              className="p-1 text-slate-400 hover:text-rose-600 dark:hover:text-rose-400 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800"
                              title="Eliminar"
                            >
                              <Icon name="trash-2" size={16} />
                            </button>
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </Card>
        </div>
      );
    };

    // =========================================================================
    // 11. PRESUPUESTOS MENSUALES
    // =========================================================================
    const BudgetsView = ({ data, onUpdateBudget }) => {
      // Calcular gastos reales acumulados este mes por categoría
      const spentByCategory = useMemo(() => {
        const res = {};
        data.transactions
          .filter(t => t.type === 'expense')
          .forEach(t => {
            res[t.category] = (res[t.category] || 0) + t.amount;
          });
        return res;
      }, [data.transactions]);

      return (
        <div className="space-y-6">
          <div className="pb-2 border-b border-slate-200 dark:border-slate-800">
            <h1 className="text-2xl font-bold text-slate-900 dark:text-white">Presupuesto Mensual</h1>
            <p className="text-sm text-slate-500">Límites de gasto para mantener tu ahorro bajo control.</p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {data.budgets.map(b => {
              const spent = spentByCategory[b.category] || 0;
              const cat = CATEGORIES[b.category] || { name: b.category, icon: '🏷️' };
              const percent = Math.round((spent / b.limit) * 100);
              const isOver = spent > b.limit;
              const isClose = !isOver && percent >= 80;

              return (
                <Card key={b.category} className={isOver ? 'border-rose-300 dark:border-rose-900' : ''}>
                  <div className="flex items-center justify-between mb-2">
                    <div className="flex items-center gap-2">
                      <span className="text-2xl">{cat.icon}</span>
                      <div>
                        <h4 className="font-semibold text-slate-900 dark:text-white text-base">{cat.name}</h4>
                        <p className="text-xs text-slate-400">Límite mensual fijado: {formatEUR(b.limit)}</p>
                      </div>
                    </div>
                    <div className="text-right">
                      <span className={`text-base font-bold ${isOver ? 'text-rose-600' : 'text-slate-900 dark:text-white'}`}>
                        {formatEUR(spent)}
                      </span>
                      <span className="text-xs text-slate-400 block">de {formatEUR(b.limit)}</span>
                    </div>
                  </div>

                  <div className="my-3">
                    <ProgressBar
                      value={spent}
                      max={b.limit}
                      color={isOver ? 'bg-rose-500' : isClose ? 'bg-amber-500' : 'bg-emerald-500'}
                    />
                  </div>

                  <div className="text-xs mt-2">
                    {isOver ? (
                      <p className="text-rose-600 dark:text-rose-400 font-semibold flex items-center gap-1">
                        <Icon name="alert-triangle" size={14} /> Has superado tu presupuesto de {cat.name.toLowerCase()} en {formatEUR(spent - b.limit)}.
                      </p>
                    ) : isClose ? (
                      <p className="text-amber-600 dark:text-amber-400 font-medium flex items-center gap-1">
                        <Icon name="alert-circle" size={14} /> Has utilizado el {percent} % de tu presupuesto de {cat.name.toLowerCase()}.
                      </p>
                    ) : (
                      <p className="text-slate-500 flex items-center gap-1">
                        <Icon name="check" size={14} className="text-emerald-500" /> Te quedan {formatEUR(b.limit - spent)} disponibles este mes.
                      </p>
                    )}
                  </div>
                </Card>
              );
            })}
          </div>
        </div>
      );
    };

    // =========================================================================
    // 12. OBJETIVOS FINANCIEROS Y SUEÑOS
    // =========================================================================
    const GoalsView = ({ data, onAddGoal, onUpdateGoalDeposit }) => {
      const [showModal, setShowModal] = useState(false);
      const [newGoal, setNewGoal] = useState({
        name: '',
        target: 3000,
        current: 0,
        deadline: '2027-12-31',
        category: 'travel',
        icon: '✈️'
      });

      const handleCreate = (e) => {
        e.preventDefault();
        if (!newGoal.name) return;
        onAddGoal({
          ...newGoal,
          id: 'goal_' + Date.now(),
          target: Number(newGoal.target),
          current: Number(newGoal.current)
        });
        setShowModal(false);
        if (window.confetti) window.confetti({ particleCount: 70, spread: 60 });
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-2 border-b border-slate-200 dark:border-slate-800">
            <div>
              <h1 className="text-2xl font-bold text-slate-900 dark:text-white">Mis Objetivos</h1>
              <p className="text-sm text-slate-500">Convierte tus proyectos en planes con ahorro mensual asignado.</p>
            </div>
            <Button variant="primary" size="sm" onClick={() => setShowModal(true)} icon="plus">
              + Crear objetivo
            </Button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            {data.goals.map(goal => {
              const remaining = Math.max(0, goal.target - goal.current);
              const deadlineDate = new Date(goal.deadline);
              const now = new Date();
              const diffMonths = Math.max(1, Math.round((deadlineDate - now) / (1000 * 60 * 60 * 24 * 30.4)));
              const monthlyRequired = Math.round(remaining / diffMonths);
              const isCompleted = goal.current >= goal.target;

              return (
                <Card key={goal.id} className="relative overflow-hidden flex flex-col justify-between">
                  <div>
                    <div className="flex items-start justify-between">
                      <div className="flex items-center gap-3">
                        <span className="text-3xl p-2 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-100 dark:border-slate-700">
                          {goal.icon || '🎯'}
                        </span>
                        <div>
                          <h4 className="font-bold text-slate-900 dark:text-white text-lg">{goal.name}</h4>
                          <p className="text-xs text-slate-400">Fecha objetivo: {formatDateES(goal.deadline)}</p>
                        </div>
                      </div>
                      {isCompleted && (
                        <span className="px-2.5 py-1 text-xs font-bold rounded-full bg-emerald-100 text-emerald-700">
                          ¡Completado!
                        </span>
                      )}
                    </div>

                    <div className="my-5">
                      <div className="flex justify-between items-baseline mb-1.5">
                        <span className="text-2xl font-extrabold text-slate-900 dark:text-white">{formatEUR(goal.current)}</span>
                        <span className="text-xs text-slate-400 font-medium">Meta: {formatEUR(goal.target)}</span>
                      </div>
                      <ProgressBar value={goal.current} max={goal.target} />
                    </div>

                    {!isCompleted ? (
                      <div className="grid grid-cols-2 gap-2 p-3 bg-slate-50 dark:bg-slate-800/60 rounded-xl text-xs text-slate-600 dark:text-slate-300">
                        <div>
                          <span className="text-slate-400 block">Cantidad restante</span>
                          <span className="font-bold text-slate-800 dark:text-slate-100">{formatEUR(remaining)}</span>
                        </div>
                        <div>
                          <span className="text-slate-400 block">Ahorro mensual necesario</span>
                          <span className="font-bold text-emerald-600 dark:text-emerald-400">{formatEUR(monthlyRequired)}/mes</span>
                        </div>
                      </div>
                    ) : (
                      <p className="text-xs text-emerald-600 font-semibold p-2 bg-emerald-50 rounded-lg text-center">
                        🎉 Has alcanzado el 100% de este objetivo financiero.
                      </p>
                    )}
                  </div>

                  <div className="mt-5 pt-3 border-t border-slate-100 dark:border-slate-800 flex justify-between items-center text-xs">
                    <span className="text-slate-400">
                      {isCompleted ? 'Finalizado con éxito' : `Te faltan aprox. ${diffMonths} meses.`}
                    </span>
                    <Button
                      variant="secondary"
                      size="sm"
                      onClick={() => {
                        const deposit = prompt(`¿Cuánto dinero quieres aportar hoy a "${goal.name}"? (€):`, "100");
                        if (deposit && !isNaN(deposit) && Number(deposit) > 0) {
                          onUpdateGoalDeposit(goal.id, Number(deposit));
                          if (window.confetti) window.confetti({ particleCount: 50 });
                        }
                      }}
                      icon="plus-circle"
                    >
                      Aportar ahorro
                    </Button>
                  </div>
                </Card>
              );
            })}
          </div>

          {/* Modal Crear Objetivo */}
          <Modal isOpen={showModal} onClose={() => setShowModal(false)} title="Crear nuevo objetivo financiero">
            <form onSubmit={handleCreate} className="space-y-4">
              <div>
                <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Nombre del objetivo</label>
                <input
                  type="text"
                  required
                  placeholder="Ej: Viaje a Japón, Entrada Vivienda..."
                  className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"
                  value={newGoal.name}
                  onChange={(e) => setNewGoal({ ...newGoal, name: e.target.value })}
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Cantidad objetivo (€)</label>
                  <input
                    type="number"
                    required
                    className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"
                    value={newGoal.target}
                    onChange={(e) => setNewGoal({ ...newGoal, target: Number(e.target.value) })}
                  />
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Ya ahorrado (€)</label>
                  <input
                    type="number"
                    className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"
                    value={newGoal.current}
                    onChange={(e) => setNewGoal({ ...newGoal, current: Number(e.target.value) })}
                  />
                </div>
              </div>

              <div>
                <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Fecha objetivo</label>
                <input
                  type="date"
                  required
                  className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"
                  value={newGoal.deadline}
                  onChange={(e) => setNewGoal({ ...newGoal, deadline: e.target.value })}
                />
              </div>

              <div className="pt-2 flex justify-end gap-2">
                <Button variant="outline" size="sm" onClick={() => setShowModal(false)}>Cancelar</Button>
                <Button variant="primary" size="sm" type="submit">Guardar objetivo</Button>
              </div>
            </form>
          </Modal>
        </div>
      );
    };

    // =========================================================================
    // 13. CALCULADORAS Y SIMULADORES (INTERÉS COMPUESTO Y AMORTIZACIÓN)
    // =========================================================================
    const CalculatorsView = () => {
      // Estado Interés Compuesto
      const [principal, setPrincipal] = useState(5000);
      const [monthly, setMonthly] = useState(300);
      const [rate, setRate] = useState(7);
      const [years, setYears] = useState(15);

      const compoundCalc = useMemo(() => {
        const r = rate / 100 / 12;
        const n = years * 12;
        let total = principal;
        let totalInvested = principal;

        for (let i = 0; i < n; i++) {
          total = (total + monthly) * (1 + r);
          totalInvested += monthly;
        }

        const totalInterest = Math.max(0, total - totalInvested);

        return {
          finalCapital: total,
          totalInvested,
          totalInterest
        };
      }, [principal, monthly, rate, years]);

      // Estado Amortización de Deuda (Avalancha vs Bola de nieve)
      const [debtBalance, setDebtBalance] = useState(8000);
      const [debtRate, setDebtRate] = useState(7.5);
      const [debtPayment, setDebtPayment] = useState(250);

      const amortizationCalc = useMemo(() => {
        const monthlyRate = debtRate / 100 / 12;
        if (debtPayment <= debtBalance * monthlyRate) {
          return { months: Infinity, totalInterest: Infinity, feasible: false };
        }
        let balance = debtBalance;
        let months = 0;
        let totalInterestPaid = 0;

        while (balance > 0 && months < 360) {
          const interestMonth = balance * monthlyRate;
          totalInterestPaid += interestMonth;
          const principalMonth = Math.min(balance, debtPayment - interestMonth);
          balance -= principalMonth;
          months++;
        }

        return {
          months,
          totalInterest: totalInterestPaid,
          feasible: true
        };
      }, [debtBalance, debtRate, debtPayment]);

      return (
        <div className="space-y-8">
          <div className="pb-2 border-b border-slate-200 dark:border-slate-800">
            <h1 className="text-2xl font-bold text-slate-900 dark:text-white">Simuladores y Calculadoras</h1>
            <p className="text-sm text-slate-500">Cálculos matemáticos puros en tiempo real para proyectar tu futuro.</p>
          </div>

          {/* Calculadora de Interés Compuesto */}
          <Card title="Calculadora de Crecimiento e Interés Compuesto" subtitle="Visualiza el efecto multiplicador de la constancia y el tiempo">
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 mt-4">
              <div className="space-y-5">
                <div>
                  <div className="flex justify-between text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    <span>Capital inicial aportado</span>
                    <span className="text-emerald-600 font-bold">{formatEUR(principal)}</span>
                  </div>
                  <input
                    type="range"
                    min="0"
                    max="50000"
                    step="500"
                    value={principal}
                    onChange={(e) => setPrincipal(Number(e.target.value))}
                    className="w-full accent-emerald-600"
                  />
                </div>

                <div>
                  <div className="flex justify-between text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    <span>Aportación mensual periódica</span>
                    <span className="text-emerald-600 font-bold">{formatEUR(monthly)} / mes</span>
                  </div>
                  <input
                    type="range"
                    min="0"
                    max="2000"
                    step="25"
                    value={monthly}
                    onChange={(e) => setMonthly(Number(e.target.value))}
                    className="w-full accent-emerald-600"
                  />
                </div>

                <div>
                  <div className="flex justify-between text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    <span>Rentabilidad anual estimada (%)</span>
                    <span className="text-emerald-600 font-bold">{rate} % anual</span>
                  </div>
                  <input
                    type="range"
                    min="1"
                    max="15"
                    step="0.5"
                    value={rate}
                    onChange={(e) => setRate(Number(e.target.value))}
                    className="w-full accent-emerald-600"
                  />
                </div>

                <div>
                  <div className="flex justify-between text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    <span>Plazo de tiempo (años)</span>
                    <span className="text-emerald-600 font-bold">{years} años</span>
                  </div>
                  <input
                    type="range"
                    min="1"
                    max="40"
                    step="1"
                    value={years}
                    onChange={(e) => setYears(Number(e.target.value))}
                    className="w-full accent-emerald-600"
                  />
                </div>
              </div>

              {/* Resultados del interés compuesto */}
              <div className="p-6 bg-slate-50 dark:bg-slate-800/60 rounded-2xl border border-slate-200 dark:border-slate-700 flex flex-col justify-between">
                <div>
                  <p className="text-xs font-semibold uppercase tracking-wider text-slate-400">Capital final estimado</p>
                  <p className="text-3xl lg:text-4xl font-extrabold text-slate-900 dark:text-white mt-1">
                    {formatEUR(compoundCalc.finalCapital)}
                  </p>

                  <div className="mt-6 space-y-3">
                    <div className="flex justify-between text-xs">
                      <span className="text-slate-500">Dinero aportado de tu bolsillo:</span>
                      <span className="font-semibold text-slate-800 dark:text-slate-200">{formatEUR(compoundCalc.totalInvested)}</span>
                    </div>
                    <div className="flex justify-between text-xs">
                      <span className="text-slate-500">Rendimiento generado (Intereses):</span>
                      <span className="font-bold text-emerald-600 dark:text-emerald-400">+{formatEUR(compoundCalc.totalInterest)}</span>
                    </div>
                  </div>

                  <div className="w-full h-3 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden flex mt-4">
                    <div
                      className="bg-slate-400 h-full"
                      style={{ width: `${(compoundCalc.totalInvested / compoundCalc.finalCapital) * 100}%` }}
                      title="Tu capital"
                    />
                    <div
                      className="bg-emerald-500 h-full"
                      style={{ width: `${(compoundCalc.totalInterest / compoundCalc.finalCapital) * 100}%` }}
                      title="Intereses"
                    />
                  </div>
                </div>

                <div className="mt-6 p-3 bg-amber-50 dark:bg-amber-950/20 border border-amber-200 dark:border-amber-800 rounded-xl text-xs text-amber-800 dark:text-amber-300">
                  ⚠️️ <strong>Aviso legal:</strong> Los cálculos mostrados son estimaciones matemáticas basadas en una tasa constante hipotética y no garantizan rentabilidades futuras de mercado.
                </div>
              </div>
            </div>
          </Card>

          {/* Simulador de Amortización de Deudas */}
          <Card title="Simulador de Amortización de Deudas" subtitle="Calcula cuánto tiempo e intereses te ahorras incrementando tu cuota">
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mt-4">
              <div>
                <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Deuda pendiente total (€)</label>
                <input
                  type="number"
                  className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"
                  value={debtBalance}
                  onChange={(e) => setDebtBalance(Number(e.target.value))}
                />
              </div>
              <div>
                <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Tipo de interés anual (TIN %)</label>
                <input
                  type="number"
                  step="0.1"
                  className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"
                  value={debtRate}
                  onChange={(e) => setDebtRate(Number(e.target.value))}
                />
              </div>
              <div>
                <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Pago mensual previsto (€)</label>
                <input
                  type="number"
                  className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"
                  value={debtPayment}
                  onChange={(e) => setDebtPayment(Number(e.target.value))}
                />
              </div>
            </div>

            <div className="mt-6 p-4 bg-slate-50 dark:bg-slate-800/60 rounded-xl border border-slate-200 dark:border-slate-700">
              {amortizationCalc.feasible ? (
                <div className="flex flex-col sm:flex-row justify-between items-center gap-4 text-center sm:text-left">
                  <div>
                    <p className="text-xs text-slate-400">Tiempo estimado para liquidación</p>
                    <p className="text-2xl font-bold text-slate-900 dark:text-white">
                      {Math.floor(amortizationCalc.months / 12)} años y {amortizationCalc.months % 12} meses
                    </p>
                  </div>
                  <div>
                    <p className="text-xs text-slate-400">Total pagado en concepto de intereses</p>
                    <p className="text-2xl font-bold text-rose-600">
                      {formatEUR(amortizationCalc.totalInterest)}
                    </p>
                  </div>
                  <div className="text-xs text-slate-500 max-w-xs">
                    💡 Si aumentas tu cuota mensual en solo 50 €, recortarás meses de pago e intereses acumulados.
                  </div>
                </div>
              ) : (
                <p className="text-xs text-rose-600 font-semibold">
                  La cuota mensual introducida no cubre ni los intereses mínimos generados por la deuda. Aumenta la cuota.
                </p>
              )}
            </div>
          </Card>
        </div>
      );
    };

    // =========================================================================
    // 14. SECCIÓN DE INVERSIONES & CARTERA
    // =========================================================================
    const InvestmentsView = ({ data }) => {
      const totalInvested = data.investments.reduce((sum, i) => sum + i.invested, 0);
      const totalCurrent = data.investments.reduce((sum, i) => sum + i.current, 0);
      const totalGain = totalCurrent - totalInvested;
      const totalReturn = totalInvested > 0 ? ((totalGain / totalInvested) * 100).toFixed(2) : 0;

      return (
        <div className="space-y-6">
          <div className="pb-2 border-b border-slate-200 dark:border-slate-800">
            <h1 className="text-2xl font-bold text-slate-900 dark:text-white">Inversiones y Patrimonio</h1>
            <p className="text-sm text-slate-500">
              Seguimiento unificado de tus fondos indexados, cuentas remuneradas y depósitos.
            </p>
          </div>

          {/* Tarjetas resumen */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <StatCard
              title="Capital Aportado"
              value={formatEUR(totalInvested)}
              detail="Dinero invertido acumulado"
              icon="layers"
            />
            <StatCard
              title="Valor Liquidativo Actual"
              value={formatEUR(totalCurrent)}
              detail="Valor de mercado hoy"
              icon="trending-up"
            />
            <StatCard
              title="Plusvalía Latente"
              value={`+${formatEUR(totalGain)}`}
              detail={`Rentabilidad ponderada: +${totalReturn} %`}
              icon="pie-chart"
              trend="up"
              trendValue={`+${totalReturn}%`}
            />
          </div>

          {/* Lista de posiciones */}
          <Card title="Posiciones de Inversión Registradas" subtitle="Cartera de activos mantenidos">
            <div className="divide-y divide-slate-100 dark:divide-slate-800">
              {data.investments.map(inv => (
                <div key={inv.id} className="py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                  <div>
                    <p className="font-semibold text-slate-900 dark:text-white text-base">{inv.name}</p>
                    <span className="inline-block mt-1 px-2 py-0.5 rounded text-xs bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                      {inv.type}
                    </span>
                  </div>
                  <div className="text-right flex items-center gap-6">
                    <div>
                      <p className="text-xs text-slate-400">Capital aportado</p>
                      <p className="font-medium text-slate-700 dark:text-slate-300">{formatEUR(inv.invested)}</p>
                    </div>
                    <div>
                      <p className="text-xs text-slate-400">Valor actual</p>
                      <p className="font-bold text-slate-900 dark:text-white">{formatEUR(inv.current)}</p>
                    </div>
                    <div>
                      <p className="text-xs text-slate-400">Rentabilidad</p>
                      <span className="font-bold text-emerald-600">+{inv.returnRate}%</span>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </Card>

          {/* Tarjetas educativas */}
          <div>
            <h3 className="font-bold text-slate-900 dark:text-white text-lg mb-3">Conceptos clave para invertir con cabeza</h3>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <Card title="Diversificación Global">
                <p className="text-xs text-slate-600 dark:text-slate-400 leading-relaxed">
                  No poner todos los huevos en la misma cesta. Un fondo indexado al mundo invierte en más de 1.500 empresas de múltiples países a costes mínimos.
                </p>
              </Card>
              <Card title="Horizonte Temporal">
                <p className="text-xs text-slate-600 dark:text-slate-400 leading-relaxed">
                  El dinero que vayas a necesitar en menos de 3 años debe estar en cuentas remuneradas o depósitos seguros. La renta variable requiere más de 5 a 10 años.
                </p>
              </Card>
              <Card title="Interés Compuesto">
                <p className="text-xs text-slate-600 dark:text-slate-400 leading-relaxed">
                  Reinvertir los dividendos y ganancias genera un crecimiento exponencial con el paso de las décadas, acelerando tu patrimonio sin esfuerzo extra.
                </p>
              </Card>
            </div>
          </div>
        </div>
      );
    };

    // =========================================================================
    // 15. HÁBITOS, PLAN FINANCIERO Y CALENDARIO
    // =========================================================================
    const HabitsAndPlanView = ({ data, onToggleHabit }) => (
      <div className="space-y-6">
        <div className="pb-2 border-b border-slate-200 dark:border-slate-800">
          <h1 className="text-2xl font-bold text-slate-900 dark:text-white">Hábitos y Hoja de Ruta</h1>
          <p className="text-sm text-slate-500">La consistencia diaria crea la libertad financiera de mañana.</p>
        </div>

        {/* Hábitos diarios */}
        <Card title="Tus Hábitos Financieros Activos" subtitle="Registra tus rutinas para mantener tus rachas">
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {data.habits.map(h => (
              <div
                key={h.id}
                onClick={() => onToggleHabit(h.id)}
                className={`p-4 rounded-xl border cursor-pointer transition-all flex items-center justify-between ${h.completedToday ? 'border-emerald-500 bg-emerald-50/50 dark:bg-emerald-950/20' : 'border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/40'}`}
              >
                <div className="flex items-center gap-3">
                  <div className={`w-6 h-6 rounded-md flex items-center justify-center border ${h.completedToday ? 'bg-emerald-600 border-emerald-600 text-white' : 'border-slate-300 dark:border-slate-600'}`}>
                    {h.completedToday && <Icon name="check" size={14} />}
                  </div>
                  <div>
                    <p className={`text-sm font-semibold ${h.completedToday ? 'line-through text-slate-400' : 'text-slate-900 dark:text-white'}`}>{h.title}</p>
                    <p className="text-xs text-emerald-600 dark:text-emerald-400 font-medium">🔥 {h.streak} días consecutivos</p>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </Card>

        {/* Hoja de ruta cronológica */}
        <Card title="Tu Plan Financiero Secuencial" subtitle="Fases estructuradas para el crecimiento de tu capital">
          <div className="space-y-6 relative before:absolute before:inset-0 before:left-3.5 before:w-0.5 before:bg-slate-200 dark:before:bg-slate-800 pl-8">
            <div className="relative">
              <div className="absolute -left-8 top-1 w-4 h-4 rounded-full bg-emerald-500 ring-4 ring-white dark:ring-slate-900"></div>
              <h4 className="text-sm font-bold text-slate-900 dark:text-white">Fase 1: Fondo de Emergencia Básico</h4>
              <p className="text-xs text-slate-500 mt-1">Conseguir 3 meses de gastos esenciales (4.200 €) en una cuenta remunerada líquida.</p>
              <span className="inline-block mt-2 text-xs font-semibold text-emerald-600">Estado: En progreso (68%)</span>
            </div>

            <div className="relative">
              <div className="absolute -left-8 top-1 w-4 h-4 rounded-full bg-slate-300 dark:bg-slate-700 ring-4 ring-white dark:ring-slate-900"></div>
              <h4 className="text-sm font-bold text-slate-900 dark:text-white">Fase 2: Liquidación de Deuda Cara</h4>
              <p className="text-xs text-slate-500 mt-1">Amortizar por completo la tarjeta revolving antes de destinar capital a riesgo.</p>
              <span className="inline-block mt-2 text-xs text-slate-400">Previsto para: 2027</span>
            </div>

            <div className="relative">
              <div className="absolute -left-8 top-1 w-4 h-4 rounded-full bg-slate-300 dark:bg-slate-700 ring-4 ring-white dark:ring-slate-900"></div>
              <h4 className="text-sm font-bold text-slate-900 dark:text-white">Fase 3: Aportaciones Indexadas Automáticas</h4>
              <p className="text-xs text-slate-500 mt-1">Programar transferencia periódica mensual de 300 € a un fondo indexado global.</p>
              <span className="inline-block mt-2 text-xs text-slate-400">A largo plazo</span>
            </div>
          </div>
        </Card>
      </div>
    );

    // =========================================================================
    // 16. AJUSTES Y PERFIL DE USUARIO
    // =========================================================================
    const ProfileView = ({ data, onResetDemo, onExportData, onToggleTheme, isDark }) => (
      <div className="space-y-6 max-w-4xl">
        <div className="pb-2 border-b border-slate-200 dark:border-slate-800">
          <h1 className="text-2xl font-bold text-slate-900 dark:text-white">Perfil y Configuración</h1>
          <p className="text-sm text-slate-500">Gestión de tu cuenta, seguridad y preferencias de visualización.</p>
        </div>

        <Card title="Datos Personales" subtitle="Información visible de tu cuenta">
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
            <div>
              <span className="text-xs text-slate-400 block mb-1">Nombre completo</span>
              <p className="font-semibold text-slate-900 dark:text-white">{data.user.name} {data.user.surname}</p>
            </div>
            <div>
              <span className="text-xs text-slate-400 block mb-1">Correo electrónico</span>
              <p className="font-semibold text-slate-900 dark:text-white">{data.user.email}</p>
            </div>
            <div>
              <span className="text-xs text-slate-400 block mb-1">Moneda oficial</span>
              <p className="font-semibold text-slate-900 dark:text-white">Euro (€) - EUR</p>
            </div>
            <div>
              <span className="text-xs text-slate-400 block mb-1">País y zona fiscal</span>
              <p className="font-semibold text-slate-900 dark:text-white">España (Península e Islas)</p>
            </div>
          </div>
        </Card>

        <Card title="Preferencias y Apariencia">
          <div className="flex items-center justify-between py-2">
            <div>
              <p className="font-semibold text-sm text-slate-900 dark:text-white">Modo oscuro</p>
              <p className="text-xs text-slate-400">Alternar entre tema visual claro y nocturno</p>
            </div>
            <Button variant="outline" size="sm" onClick={onToggleTheme} icon={isDark ? "sun" : "moon"}>
              {isDark ? "Modo Claro" : "Modo Oscuro"}
            </Button>
          </div>
        </Card>

        <Card title="Zona de Datos y Privacidad">
          <div className="space-y-4">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-3 border-b border-slate-100 dark:border-slate-800">
              <div>
                <p className="font-semibold text-sm text-slate-900 dark:text-white">Copia de seguridad completa (JSON)</p>
                <p className="text-xs text-slate-400">Descarga un archivo con todos tus movimientos, objetivos y deudas.</p>
              </div>
              <Button variant="outline" size="sm" onClick={onExportData} icon="download">
                Descargar JSON
              </Button>
            </div>

            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div>
                <p className="font-semibold text-sm text-rose-600">Restablecer datos de demostración</p>
                <p className="text-xs text-slate-400">Borra los cambios locales y devuelve la app a los datos iniciales de prueba.</p>
              </div>
              <Button
                variant="danger"
                size="sm"
                onClick={() => {
                  if (confirm("¿Estás seguro de que quieres restablecer todos los datos a la demostración inicial?")) {
                    onResetDemo();
                  }
                }}
                icon="refresh-cw"
              >
                Restablecer Demo
              </Button>
            </div>
          </div>
        </Card>
      </div>
    );

    // =========================================================================
    // 17. APLICACIÓN PRINCIPAL (ORQUESTADOR GLOBAL)
    // =========================================================================
    const App = () => {
      const [appData, setAppData] = useState(() => db.get());
      const [currentView, setCurrentView] = useState('landing'); // 'landing' | 'auth' | 'onboarding' | 'dashboard' | 'movimientos' | 'presupuesto' | 'objetivos' | 'calculadoras' | 'inversiones' | 'habitos' | 'perfil'
      const [isDarkMode, setIsDarkMode] = useState(false);
      const [isQuickAddOpen, setIsQuickAddOpen] = useState(false);

      // Estado del formulario de Acción Rápida (+ Añadir)
      const [newTx, setNewTx] = useState({
        concept: '',
        amount: '',
        type: 'expense',
        category: 'food',
        account: 'Tarjeta Visa Débito',
        notes: ''
      });

      // Persistir siempre que haya cambios en el estado
      useEffect(() => {
        db.set(appData);
      }, [appData]);

      // Alternar modo oscuro en el nodo raíz
      useEffect(() => {
        if (isDarkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [isDarkMode]);

      // Manejadores de acciones
      const handleLoginSuccess = (userData, isNewUser) => {
        setAppData(prev => ({
          ...prev,
          user: { ...prev.user, ...userData }
        }));
        if (isNewUser) {
          setCurrentView('onboarding');
        } else {
          setCurrentView('dashboard');
        }
      };

      const handleOnboardingComplete = (form) => {
        setAppData(prev => {
          const updated = { ...prev };
          // Añadir nómina calculada
          if (form.salary > 0) {
            updated.transactions.push({
              id: 'tx_onb_1',
              concept: 'Salario mensual inicial',
              amount: Number(form.salary),
              type: 'income',
              category: 'salary',
              date: new Date().toISOString().slice(0, 10),
              account: 'Cuenta Corriente',
              notes: 'Fijado en onboarding'
            });
          }
          // Añadir objetivo inicial
          if (form.primaryGoalName) {
            updated.goals.unshift({
              id: 'goal_onb_1',
              name: form.primaryGoalName,
              target: Number(form.primaryGoalAmount),
              current: 0,
              deadline: new Date(Date.now() + form.primaryGoalMonths * 30 * 24 * 3600 * 1000).toISOString().slice(0, 10),
              category: 'emergency',
              icon: '🛡️',
              priority: 'high'
            });
          }
          return updated;
        });
        setCurrentView('dashboard');
      };

      const handleAddTransaction = (e) => {
        e.preventDefault();
        if (!newTx.concept || !newTx.amount) return;

        const created = {
          id: 'tx_' + Date.now(),
          concept: newTx.concept,
          amount: parseFloat(newTx.amount),
          type: newTx.type,
          category: newTx.category,
          account: newTx.account,
          date: new Date().toISOString().slice(0, 10),
          notes: newTx.notes
        };

        setAppData(prev => ({
          ...prev,
          transactions: [created, ...prev.transactions]
        }));

        setNewTx({ concept: '', amount: '', type: 'expense', category: 'food', account: 'Tarjeta Visa Débito', notes: '' });
        setIsQuickAddOpen(false);
      };

      const handleDeleteTransaction = (id) => {
        setAppData(prev => ({
          ...prev,
          transactions: prev.transactions.filter(t => t.id !== id)
        }));
      };

      const handleAddGoal = (goal) => {
        setAppData(prev => ({
          ...prev,
          goals: [goal, ...prev.goals]
        }));
      };

      const handleUpdateGoalDeposit = (goalId, amount) => {
        setAppData(prev => ({
          ...prev,
          goals: prev.goals.map(g => g.id === goalId ? { ...g, current: g.current + amount } : g)
        }));
      };

      const handleToggleHabit = (id) => {
        setAppData(prev => ({
          ...prev,
          habits: prev.habits.map(h => {
            if (h.id === id) {
              const completed = !h.completedToday;
              return { ...h, completedToday: completed, streak: completed ? h.streak + 1 : Math.max(0, h.streak - 1) };
            }
            return h;
          })
        }));
      };

      const handleResetDemo = () => {
        const fresh = db.reset();
        setAppData(fresh);
        alert("La aplicación ha sido restablecida a sus datos de prueba originales.");
      };

      const handleExportData = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
        const dlAnchorElem = document.createElement('a');
        dlAnchorElem.setAttribute("href", dataStr);
        dlAnchorElem.setAttribute("download", `aura_finance_backup_${new Date().toISOString().slice(0,10)}.json`);
        dlAnchorElem.click();
      };

      // Si está en Landing o Auth, renderizar vistas aisladas
      if (currentView === 'landing') {
        return <LandingPage onStartApp={() => setCurrentView('dashboard')} onLoginClick={() => setCurrentView('auth')} />;
      }

      if (currentView === 'auth') {
        return <AuthScreen onLoginSuccess={handleLoginSuccess} onCancel={() => setCurrentView('landing')} />;
      }

      if (currentView === 'onboarding') {
        return <OnboardingWizard onComplete={handleOnboardingComplete} />;
      }

      // Menú de navegación lateral Desktop
      const NAV_ITEMS = [
        { id: 'dashboard', label: 'Inicio', icon: 'layout-dashboard' },
        { id: 'movimientos', label: 'Movimientos', icon: 'arrow-left-right' },
        { id: 'presupuesto', label: 'Presupuestos', icon: 'pie-chart' },
        { id: 'objetivos', label: 'Mis Objetivos', icon: 'target' },
        { id: 'calculadoras', label: 'Calculadoras', icon: 'calculator' },
        { id: 'inversiones', label: 'Inversiones', icon: 'trending-up' },
        { id: 'habitos', label: 'Plan & Hábitos', icon: 'check-square' },
        { id: 'perfil', label: 'Perfil & Ajustes', icon: 'settings' }
      ];

      return (
        <div className="min-h-screen flex flex-col md:flex-row">
          {/* SIDEBAR DESKTOP */}
          <aside className="hidden md:flex flex-col w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 p-5 shrink-0 select-none">
            {/* Logo */}
            <div className="flex items-center gap-2.5 pb-6 border-b border-slate-100 dark:border-slate-800">
              <div className="w-8 h-8 rounded-xl bg-emerald-600 text-white flex items-center justify-center font-bold">
                <Icon name="shield-check" size={18} />
              </div>
              <div>
                <span className="font-bold text-slate-900 dark:text-white text-base tracking-tight">Aura Finance</span>
                <span className="block text-[10px] text-emerald-600 font-bold uppercase tracking-wider">Plan Comercial</span>
              </div>
            </div>

            {/* Botón Acción Rápida */}
            <div className="my-5">
              <Button
                variant="primary"
                className="w-full py-2.5 shadow-md shadow-emerald-600/20"
                onClick={() => setIsQuickAddOpen(true)}
                icon="plus"
              >
                + Añadir
              </Button>
            </div>

            {/* Enlaces de Navegación */}
            <nav className="space-y-1 flex-1">
              {NAV_ITEMS.map(item => (
                <button
                  key={item.id}
                  onClick={() => setCurrentView(item.id)}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-colors ${currentView === item.id ? 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-400 font-semibold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800'}`}
                >
                  <Icon name={item.icon} size={18} />
                  <span>{item.label}</span>
                </button>
              ))}
            </nav>

            {/* Widget Inferior de usuario */}
            <div className="pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center font-bold text-xs text-slate-700 dark:text-slate-200">
                  {appData.user.name[0]}
                </div>
                <div className="text-left">
                  <p className="text-xs font-semibold text-slate-900 dark:text-white leading-tight">{appData.user.name}</p>
                  <p className="text-[10px] text-slate-400">Edición España</p>
                </div>
              </div>
              <button
                onClick={() => setCurrentView('landing')}
                className="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800"
                title="Cerrar sesión"
              >
                <Icon name="log-out" size={16} />
              </button>
            </div>
          </aside>

          {/* CONTENIDO PRINCIPAL */}
          <main className="flex-1 flex flex-col min-w-0 pb-20 md:pb-8">
            {/* Header móvil */}
            <div className="md:hidden flex items-center justify-between p-4 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-30">
              <div className="flex items-center gap-2">
                <div className="w-7 h-7 rounded-lg bg-emerald-600 text-white flex items-center justify-center font-bold">
                  <Icon name="shield-check" size={16} />
                </div>
                <span className="font-bold text-slate-900 dark:text-white">Aura</span>
              </div>
              <div className="flex items-center gap-2">
                <Button variant="primary" size="sm" onClick={() => setIsQuickAddOpen(true)} icon="plus">
                  Añadir
                </Button>
              </div>
            </div>

            <div className="p-4 sm:p-6 lg:p-8 max-w-6xl mx-auto w-full">
              {currentView === 'dashboard' && <DashboardView data={appData} onNavigate={setCurrentView} onOpenQuickAdd={() => setIsQuickAddOpen(true)} />}
              {currentView === 'movimientos' && <TransactionsView data={appData} onAddTx={() => setIsQuickAddOpen(true)} onDeleteTx={handleDeleteTransaction} />}
              {currentView === 'presupuesto' && <BudgetsView data={appData} />}
              {currentView === 'objetivos' && <GoalsView data={appData} onAddGoal={handleAddGoal} onUpdateGoalDeposit={handleUpdateGoalDeposit} />}
              {currentView === 'calculadoras' && <CalculatorsView />}
              {currentView === 'inversiones' && <InvestmentsView data={appData} />}
              {currentView === 'habitos' && <HabitsAndPlanView data={appData} onToggleHabit={handleToggleHabit} />}
              {currentView === 'perfil' && (
                <ProfileView
                  data={appData}
                  onResetDemo={handleResetDemo}
                  onExportData={handleExportData}
                  onToggleTheme={() => setIsDarkMode(!isDarkMode)}
                  isDark={isDarkMode}
                />
              )}
            </div>
          </main>

          {/* BARRA DE NAVEGACIÓN INFERIOR PARA MÓVILES */}
          <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 px-4 py-2 flex items-center justify-around z-40">
            <button
              onClick={() => setCurrentView('dashboard')}
              className={`flex flex-col items-center gap-1 text-[11px] font-medium ${currentView === 'dashboard' ? 'text-emerald-600 font-bold' : 'text-slate-400'}`}
            >
              <Icon name="layout-dashboard" size={18} />
              <span>Inicio</span>
            </button>
            <button
              onClick={() => setCurrentView('movimientos')}
              className={`flex flex-col items-center gap-1 text-[11px] font-medium ${currentView === 'movimientos' ? 'text-emerald-600 font-bold' : 'text-slate-400'}`}
            >
              <Icon name="arrow-left-right" size={18} />
              <span>Movimientos</span>
            </button>

            {/* Botón flotante central "+" */}
            <button
              onClick={() => setIsQuickAddOpen(true)}
              className="w-12 h-12 -mt-5 rounded-full bg-emerald-600 text-white flex items-center justify-center shadow-lg shadow-emerald-600/30 active:scale-95"
            >
              <Icon name="plus" size={24} />
            </button>

            <button
              onClick={() => setCurrentView('objetivos')}
              className={`flex flex-col items-center gap-1 text-[11px] font-medium ${currentView === 'objetivos' ? 'text-emerald-600 font-bold' : 'text-slate-400'}`}
            >
              <Icon name="target" size={18} />
              <span>Objetivos</span>
            </button>
            <button
              onClick={() => setCurrentView('perfil')}
              className={`flex flex-col items-center gap-1 text-[11px] font-medium ${currentView === 'perfil' ? 'text-emerald-600 font-bold' : 'text-slate-400'}`}
            >
              <Icon name="settings" size={18} />
              <span>Ajustes</span>
            </button>
          </div>

          {/* MODAL GLOBAL DE ACCIÓN RÁPIDA (+ AÑADIR) */}
          <Modal isOpen={isQuickAddOpen} onClose={() => setIsQuickAddOpen(false)} title="Registrar nuevo movimiento">
            <form onSubmit={handleAddTransaction} className="space-y-4">
              <div className="flex gap-2">
                <button
                  type="button"
                  onClick={() => setNewTx({ ...newTx, type: 'expense' })}
                  className={`flex-1 py-2 text-sm font-semibold rounded-xl border ${newTx.type === 'expense' ? 'bg-rose-50 border-rose-500 text-rose-700 dark:bg-rose-950/30' : 'border-slate-200 dark:border-slate-800'}`}
                >
                  Gasto
                </button>
                <button
                  type="button"
                  onClick={() => setNewTx({ ...newTx, type: 'income' })}
                  className={`flex-1 py-2 text-sm font-semibold rounded-xl border ${newTx.type === 'income' ? 'bg-emerald-50 border-emerald-500 text-emerald-700 dark:bg-emerald-950/30' : 'border-slate-200 dark:border-slate-800'}`}
                >
                  Ingreso
                </button>
              </div>

              <div>
                <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Concepto</label>
                <input
                  type="text"
                  required
                  placeholder="Ej: Compra supermercado, Cena, Nómina..."
                  className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"
                  value={newTx.concept}
                  onChange={(e) => setNewTx({ ...newTx, concept: e.target.value })}
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Importe (€)</label>
                  <input
                    type="number"
                    step="0.01"
                    required
                    placeholder="0,00"
                    className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"
                    value={newTx.amount}
                    onChange={(e) => setNewTx({ ...newTx, amount: e.target.value })}
                  />
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Categoría</label>
                  <select
                    className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"
                    value={newTx.category}
                    onChange={(e) => setNewTx({ ...newTx, category: e.target.value })}
                  >
                    {Object.entries(CATEGORIES).map(([k, v]) => (
                      <option key={k} value={k}>{v.icon} {v.name}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div>
                <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Cuenta o Método de pago</label>
                <input
                  type="text"
                  placeholder="Ej: Cuenta Nómina BBVA, Tarjeta Visa Débito..."
                  className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"
                  value={newTx.account}
                  onChange={(e) => setNewTx({ ...newTx, account: e.target.value })}
                />
              </div>

              <div>
                <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Notas adicionales (opcional)</label>
                <input
                  type="text"
                  placeholder="Detalles sobre el movimiento..."
                  className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"
                  value={newTx.notes}
                  onChange={(e) => setNewTx({ ...newTx, notes: e.target.value })}
                />
              </div>

              <div className="pt-3 flex justify-end gap-2">
                <Button variant="outline" size="sm" onClick={() => setIsQuickAddOpen(false)}>Cancelar</Button>
                <Button variant="primary" size="sm" type="submit">Guardar movimiento</Button>
              </div>
            </form>
          </Modal>
        </div>
      );
    };

    // Renderizar aplicación en el DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

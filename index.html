    const SUPABASE_SQL = `-- SCHEMA DE PRODUÇÃO RUNFLOW (POSTGRESQL / SUPABASE)
CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

CREATE TABLE public.profiles (

-- SEGURANÇA RLS (ROW LEVEL SECURITY)
ALTER TABLE public.profiles ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.activities ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.goals ENABLE ROW LEVEL SECURITY;

CREATE POLICY "Usuário gerencia próprio perfil" ON public.profiles FOR ALL USING (auth.uid() = id);
CREATE POLICY "Usuário gerencia próprias corridas" ON public.activities FOR ALL USING (auth.uid() = user_id);
CREATE POLICY "Usuário gerencia próprias metas" ON public.goals FOR ALL USING (auth.uid() = user_id);`;

    // Utilitários de cálculo
    function formatDuration(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = Math.floor(sec % 60);
      if (h > 0) return `${h}h ${String(m).padStart(2, '0')}m`;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function formatChrono(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = Math.floor(sec % 60);
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function calcPace(distanceKm, durationSec) {
      if (!distanceKm || distanceKm <= 0 || !durationSec) return '--:--';
      const paceSec = durationSec / distanceKm;
      const m = Math.floor(paceSec / 60);
      const s = Math.round(paceSec % 60);
      return `${m}:${String(s === 60 ? 0 : s).padStart(2, '0')}`;
    }

    function calcSpeed(distanceKm, durationSec) {
      if (!distanceKm || !durationSec) return '0.0';
      return (distanceKm / (durationSec / 3600)).toFixed(1);
    }

    function haversineKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // Gráfico SVG leve e responsivo (Zero erros de dependência externa)
    function BarChartSVG({ data, valueKey, labelKey, color = '#FF5500', suffix = ' km' }) {
      const max = Math.max(...data.map(d => d[valueKey]), 1);
      return (
        <div className="w-full h-44 flex items-end gap-2 pt-6 pb-2 px-1">
          {data.map((item, idx) => {
            const pct = Math.max((item[valueKey] / max) * 100, 4);
            return (
              <div key={idx} className="flex-1 flex flex-col items-center gap-2 group h-full justify-end">
                <span className="text-[11px] font-semibold text-zinc-400 opacity-80 group-hover:text-white transition">
                  {item[valueKey]}{suffix}
                </span>
                <div className="w-full bg-zinc-800/80 rounded-t-lg h-28 flex items-end overflow-hidden p-0.5">
                  <div
                    style={{ height: `${pct}%`, backgroundColor: color }}
                    className="w-full rounded-t-md transition-all duration-500 group-hover:brightness-110"
                  />
                </div>
                <span className="text-[11px] text-zinc-500 font-medium">{item[labelKey]}</span>
              </div>
            );
          })}
        </div>
      );
    }

    function App() {

      // Cronômetro & GPS Real
      useEffect(() => {
        let timer = null;
        if (isRunning) {
          timer = setInterval(() => setLiveSeconds(s => s + 1), 1000);
          if ('geolocation' in navigator) {
            setGpsStatus('Conectando satélite GPS...');
            watchIdRef.current = navigator.geolocation.watchPosition(
              (pos) => {
                const { latitude, longitude, accuracy } = pos.coords;
                setGpsStatus(`GPS Ativo (±${Math.round(accuracy)}m)`);
                setLiveRoute(prev => {
                  if (prev.length > 0) {
                    const last = prev[prev.length - 1];
                    const delta = haversineKm(last.lat, last.lng, latitude, longitude);
                    if (delta > 0.003 && delta < 0.2) {
                      setLiveDistance(d => Number((d + delta).toFixed(3)));
                    }
                  }
                  return [...prev, { lat: latitude, lng: longitude }];
                });
              },
              (err) => {
                setGpsStatus('GPS indisponível ou permissão negada (cronômetro ativo)');
              },
              { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
            );
          } else {
            setGpsStatus('Navegador sem suporte a GPS');
          }
        } else {
          if (watchIdRef.current !== null && 'geolocation' in navigator) {
            navigator.geolocation.clearWatch(watchIdRef.current);
            watchIdRef.current = null;
          }
        }
        return () => {
          if (timer) clearInterval(timer);
        };
      }, [isRunning]);

      // Estatísticas consolidadas
      const stats = useMemo(() => {
        const totalKm = activities.reduce((sum, a) => sum + Number(a.distance || 0), 0);
        const totalSec = activities.reduce((sum, a) => sum + Number(a.durationSec || 0), 0);
        const avgPace = calcPace(totalKm, totalSec);
        const longestRun = activities.reduce((max, a) => Math.max(max, Number(a.distance || 0)), 0);
        const bestPaceSec = activities.reduce((best, a) => {
          if (!a.distance || !a.durationSec) return best;
          const p = a.durationSec / a.distance;
          return p < best ? p : best;
        }, Infinity);
        const bestPace = bestPaceSec === Infinity
          ? '--:--'
          : `${Math.floor(bestPaceSec / 60)}:${String(Math.round(bestPaceSec % 60)).padStart(2, '0')}`;

        // Semana atual (últimos 7 dias)
        const now = new Date();
        const weekAgo = new Date(now.getTime() - 7 * 86400000);
        const weekActs = activities.filter(a => new Date(a.date) >= weekAgo);

        setActivities(DEMO_ACTIVITIES);
        setAuthStep('app');
        showToast('Modo Demonstração ativado com dados de exemplo!');
      };

      const handleAuthSubmit = (e) => {
        e.preventDefault();
        if (authMode === 'recover') {
          showToast('Link de recuperação enviado para seu e-mail!');
          setAuthMode('login');
          return;
        }
        if (authMode === 'register') {
          setAuthStep('onboarding');
          return;
        }
        // Login direto ou onboarding se novo
        setOnboardingData(d => ({ ...d, name: emailInput.split('@')[0] || 'Corredor' }));
        setAuthStep('onboarding');
      };

      const handleFinishOnboarding = (e) => {
        e.preventDefault();
        const newUser = {
          ...onboardingData,
          name: onboardingData.name || 'Corredor RUNFLOW',
          email: emailInput || 'atleta@runflow.app',
          weeklyGoalKm: onboardingData.level === 'Iniciante' ? 10 : onboardingData.level === 'Intermediário' ? 20 : 35,
          isDemo: false
        };
        setUser(newUser);
        setActivities([]);
        setAuthStep('app');
        showToast(`Bem-vindo ao RUNFLOW, ${newUser.name}!`);
      };

      const handleFinishLiveRun = () => {
        setIsRunning(false);
        if (liveSeconds < 10) {
          showToast('Corrida muito curta. Mínimo de 10 segundos para salvar.', 'error');
          return;
        }
        const finalDist = liveDistance > 0 ? liveDistance : 0.1;
        const newAct = {
          id: 'act-' + Date.now(),
          title: `Corrida GPS (${new Date().toLocaleDateString('pt-BR')})`,
          date: new Date().toISOString().split('T')[0],
          distance: Number(finalDist.toFixed(2)),
          durationSec: liveSeconds,
          type: 'Rodagem',
          feeling: 'Bom',
          calories: Math.round(finalDist * (user?.weight || 70) * 1.03),
          notes: liveRoute.length > 0 ? `Trajeto registrado com ${liveRoute.length} pontos GPS.` : 'Registrado via cronômetro RUNFLOW.',
          route: liveRoute,
          isDemo: false
        };
        setActivities(prev => [newAct, ...prev]);
        setLiveSeconds(0);
        setLiveDistance(0);
        setLiveRoute([]);
        setGpsStatus('Corrida salva com sucesso!');
        showToast('Corrida finalizada e salva no histórico!');
        setActiveTab('history');
      };

      const handleSaveManualRun = (e) => {
        e.preventDefault();
        const dist = parseFloat(manualForm.distance);
        const dur = (parseInt(manualForm.minutes || 0, 10) * 60) + parseInt(manualForm.seconds || 0, 10);
        if (!dist || dist <= 0 || dur <= 0) {
          showToast('Informe distância e tempo válidos.', 'error');
          return;
        }
        const payload = {
          id: editingId || 'act-' + Date.now(),
          title: manualForm.title || `Corrida ${manualForm.type}`,
          date: manualForm.date,
          distance: Number(dist.toFixed(2)),
          durationSec: dur,
          type: manualForm.type,
          feeling: manualForm.feeling,
          calories: Math.round(dist * (user?.weight || 70) * 1.03),
          notes: manualForm.notes,
          route: [],
          isDemo: false
        };

        if (editingId) {
          setActivities(prev => prev.map(a => a.id === editingId ? payload : a));
          setEditingId(null);
          showToast('Atividade atualizada!');
        } else {
          setActivities(prev => [payload, ...prev]);
          showToast('Corrida registrada com sucesso!');
        }
        setManualForm({ title: '', date: new Date().toISOString().split('T')[0], distance: '', minutes: '', seconds: '0', type: 'Rodagem', feeling: 'Bom', notes: '' });
      };

      const handleEditActivity = (act) => {
        setEditingId(act.id);
        setManualForm({
          title: act.title,
          date: act.date,
          distance: String(act.distance),
          minutes: String(Math.floor(act.durationSec / 60)),
          seconds: String(act.durationSec % 60),
          type: act.type,
          feeling: act.feeling || 'Bom',
          notes: act.notes || ''
        });
        setRunTab('manual');
        setActiveTab('run');
      };

      const handleDeleteActivity = (id) => {
        setActivities(prev => prev.filter(a => a.id !== id));
        showToast('Atividade excluída.');
      };

      const toggleSessionComplete = (sessionId) => {
        setCompletedSessions(prev =>
          prev.includes(sessionId) ? prev.filter(id => id !== sessionId) : [...prev, sessionId]
        );
        showToast('Progresso do programa atualizado!');
      };

      // Resposta inteligente baseada exclusivamente em dados reais
      const handleSendChat = (customPrompt) => {
        const prompt = (customPrompt || chatInput).trim();
        if (!prompt) return;
        const userMsg = { role: 'user', text: prompt };
        let reply = '';
        const lower = prompt.toLowerCase();

        if (lower.includes('dor') || lower.includes('lesão') || lower.includes('joelho') || lower.includes('canelite')) {
          reply = '⚠️ Aviso de Segurança: Não realizo diagnósticos médicos. Se você sente dor aguda, persistente ou que altera sua passada, interrompa os treinos de impacto e procure um médico do esporte ou fisioterapeuta. Para desconforto muscular leve pós-treino, priorize descanso de 48h e hidratação.';
        } else if (activities.length === 0) {
          reply = `Analisei seu perfil (${user?.level || 'Iniciante'}, meta de ${user?.daysPerWeek || 3}x/semana) e constatei que você ainda não possui corridas registradas no histórico. Recomendação inicial: comece pelo Programa "Primeiros Passos" na Escola de Corrida, alternando 5 min de caminhada leve com 1 min de trote confortável, mantendo um ritmo em que consiga conversar sem perder o fôlego.`;
        } else {
          const last = activities[0];
          reply = `📊 Baseado nos seus dados reais registrados (${activities.length} corridas, total de ${stats.totalKm.toFixed(1)} km e pace médio geral de ${stats.avgPace}/km): sua última atividade foi "${last.title}" (${last.distance} km em ${formatDuration(last.durationSec)}, pace ${calcPace(last.distance, last.durationSec)}/km). Para o próximo treino, sugiro ${last.distance >= 8 ? 'uma rodagem regenerativa curta de 4 km em ritmo bem leve para recuperação' : 'um treino contínuo moderado adicionando no máximo 10% de volume em relação à semana passada'}.`;
        }

        setChatMessages(prev => [...prev, userMsg, { role: 'ai', text: reply }]);
        setChatInput('');
      };

      // TELA DE AUTENTICAÇÃO
      if (authStep === 'login') {
        return (
          <div className="min-h-screen bg-[#070709] flex items-center justify-center p-4">
            <div className="w-full max-w-md bg-[#0D0E12] border border-zinc-800/80 rounded-3xl p-8 shadow-2xl">
              <div className="flex items-center gap-3 mb-8">
                <div className="w-11 h-11 rounded-2xl bg-[#FF5500] flex items-center justify-center text-white font-black text-xl shadow-lg shadow-[#FF5500]/30">
                  <Icon name="zap" className="w-6 h-6" />
                </div>
                <div>
                  <h1 className="text-2xl font-black tracking-tight text-white">RUNFLOW</h1>
                  <p className="text-xs text-zinc-400">Performance & Inteligência na Corrida</p>
                </div>
              </div>

              <h2 className="text-xl font-bold text-white mb-1">
                {authMode === 'login' ? 'Acesse sua conta' : authMode === 'register' ? 'Crie sua conta de corredor' : 'Recuperar senha'}
              </h2>
              <p className="text-sm text-zinc-400 mb-6">
                {authMode === 'recover' ? 'Enviaremos instruções para redefinir sua senha.' : 'Acompanhe métricas, treine com método e evolua.'}
              </p>

              <form onSubmit={handleAuthSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-zinc-400 uppercase mb-1.5">E-mail</label>
                  <input
                    type="email"
                    required
                    value={emailInput}
                    onChange={e => setEmailInput(e.target.value)}
                    placeholder="voce@exemplo.com"
                    className="w-full bg-[#15171E] border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#FF5500]"
                  />
                </div>
                {authMode !== 'recover' && (
                  <div>
                    <label className="block text-xs font-semibold text-zinc-400 uppercase mb-1.5">Senha</label>
                    <input
                      type="password"
                      required
                      value={passInput}
                      onChange={e => setPassInput(e.target.value)}
                      placeholder="••••••••"
                      className="w-full bg-[#15171E] border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#FF5500]"
                    />
                  </div>
                )}

                <button type="submit" className="w-full bg-[#FF5500] hover:bg-[#FF6A1F] text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-[#FF5500]/20">
                  {authMode === 'login' ? 'Entrar e Configurar Perfil' : authMode === 'register' ? 'Continuar para Onboarding' : 'Enviar Link de Recuperação'}
                </button>
              </form>

              <div className="mt-4 pt-4 border-t border-zinc-800/80">
                <button
                  onClick={handleEnterDemo}
                  className="w-full bg-[#15171E] hover:bg-[#1E212B] border border-zinc-700/80 text-zinc-200 font-semibold py-3 rounded-xl text-sm transition flex items-center justify-center gap-2"
                >
                  <Icon name="play-circle" className="w-4 h-4 text-[#B8FF00]" />
                  Explorar Modo Demonstração (Dados Exemplo)
                </button>
              </div>

              <div className="mt-6 flex items-center justify-between text-xs text-zinc-400">
                {authMode === 'login' ? (
                  <>
                    <button onClick={() => setAuthMode('register')} className="hover:text-[#FF5500] font-medium">Criar conta gratuita</button>
                    <button onClick={() => setAuthMode('recover')} className="hover:text-white">Esqueci a senha</button>
                  </>
                ) : (
                  <button onClick={() => setAuthMode('login')} className="hover:text-[#FF5500] font-medium">Voltar para o login</button>
                )}
              </div>
            </div>
          </div>
        );
      }

      // TELA DE ONBOARDING PERSONALIZADO
      if (authStep === 'onboarding') {
        return (
          <div className="min-h-screen bg-[#070709] flex items-center justify-center p-4">
            <div className="w-full max-w-xl bg-[#0D0E12] border border-zinc-800 rounded-3xl p-8">
              <div className="flex items-center gap-2 text-[#FF5500] text-xs font-bold uppercase tracking-wider mb-2">
                <Icon name="sliders" className="w-4 h-4" /> Personalização do Atleta
              </div>
              <h2 className="text-2xl font-black text-white mb-2">Configure seu perfil de corrida</h2>
              <p className="text-sm text-zinc-400 mb-6">Usaremos essas informações para ajustar suas metas semanais e recomendar o programa ideal.</p>

              <form onSubmit={handleFinishOnboarding} className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div className="sm:col-span-2">
                  <label className="block text-xs font-semibold text-zinc-400 mb-1">Seu Nome</label>
                  <input required value={onboardingData.name} onChange={e => setOnboardingData({...onboardingData, name: e.target.value})} placeholder="Ex: Thiago" className="w-full bg-[#15171E] border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-zinc-400 mb-1">Idade</label>
                  <input type="number" value={onboardingData.age} onChange={e => setOnboardingData({...onboardingData, age: Number(e.target.value)})} className="w-full bg-[#15171E] border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-zinc-400 mb-1">Dias disponíveis / semana</label>
                  <select value={onboardingData.daysPerWeek} onChange={e => setOnboardingData({...onboardingData, daysPerWeek: Number(e.target.value)})} className="w-full bg-[#15171E] border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white">
                    <option value={2}>2 dias por semana</option>
                    <option value={3}>3 dias por semana</option>
                    <option value={4}>4 dias por semana</option>
                    <option value={5}>5+ dias por semana</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-semibold text-zinc-400 mb-1">Peso (kg - opcional)</label>
                  <input type="number" value={onboardingData.weight} onChange={e => setOnboardingData({...onboardingData, weight: Number(e.target.value)})} className="w-full bg-[#15171E] border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-zinc-400 mb-1">Altura (cm - opcional)</label>
                  <input type="number" value={onboardingData.height} onChange={e => setOnboardingData({...onboardingData, height: Number(e.target.value)})} className="w-full bg-[#15171E] border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-zinc-400 mb-1">Nível Atual</label>
                  <select value={onboardingData.level} onChange={e => setOnboardingData({...onboardingData, level: e.target.value})} className="w-full bg-[#15171E] border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white">
                    <option value="Iniciante">Nunca corri / Iniciante</option>
                    <option value="Intermediário">Intermediário (já corro 5k)</option>
                    <option value="Avançado">Avançado (10k / 21k+)</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-semibold text-zinc-400 mb-1">Distância Desejada (km)</label>
                  <input type="number" value={onboardingData.targetDistance} onChange={e => setOnboardingData({...onboardingData, targetDistance: Number(e.target.value)})} className="w-full bg-[#15171E] border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                </div>
                <div className="sm:col-span-2">
                  <label className="block text-xs font-semibold text-zinc-400 mb-1">Objetivo Principal</label>
                  <input value={onboardingData.goal} onChange={e => setOnboardingData({...onboardingData, goal: e.target.value})} placeholder="Ex: Sair do sedentarismo, correr 5 km, baixar pace" className="w-full bg-[#15171E] border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                </div>
                <div className="sm:col-span-2 pt-2">
                  <button type="submit" className="w-full bg-[#FF5500] hover:bg-[#FF6A1F] text-white font-bold py-3.5 rounded-xl transition">
                    Iniciar Minha Jornada no RUNFLOW
                  </button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      const navItems = [
        { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
        { id: 'run', label: 'Minha Corrida', icon: 'play' },
        { id: 'school', label: 'Escola de Corrida', icon: 'graduation-cap' },
        { id: 'coach', label: 'Meu Treinador', icon: 'bot' },
        { id: 'history', label: 'Histórico', icon: 'history' },
        { id: 'goals', label: 'Metas & Desafios', icon: 'target' },
        { id: 'community', label: 'Comunidade', icon: 'users' },
        { id: 'profile', label: 'Meu Perfil', icon: 'user' },
        { id: 'settings', label: 'Configurações', icon: 'settings' }
      ];

      const weeklyGoal = user?.weeklyGoalKm || 15;
      const weeklyProgressPct = Math.min(Math.round((stats.weekKm / weeklyGoal) * 100), 100);

      const chartWeeklyData = [
        { label: 'Sem 1', km: 8.5, pace: 6.2 },
        { label: 'Sem 2', km: 11.0, pace: 6.0 },
        { label: 'Sem 3', km: 14.2, pace: 5.8 },
        { label: 'Atual', km: Number(stats.weekKm.toFixed(1)), pace: stats.totalKm > 0 ? Number((stats.totalSec / 60 / stats.totalKm).toFixed(2)) : 0 }
      ];

      return (
        <div className="min-h-screen bg-[#070709] text-zinc-100 flex flex-col lg:flex-row">
          {/* Toast Notification */}
          {toast && (
            <div className={`fixed bottom-5 right-5 z-50 px-5 py-3.5 rounded-2xl shadow-2xl border text-sm font-semibold flex items-center gap-2.5 ${toast.type === 'error' ? 'bg-red-950/90 border-red-700 text-red-200' : 'bg-[#15171E] border-[#FF5500] text-white'}`}>
              <Icon name={toast.type === 'error' ? 'alert-circle' : 'check-circle'} className="w-4 h-4 text-[#FF5500]" />
              {toast.msg}
            </div>
          )}

          {/* Sidebar Desktop */}
          <aside className="hidden lg:flex lg:w-64 lg:flex-col lg:fixed lg:inset-y-0 bg-[#0D0E12] border-r border-zinc-800/80 p-5">
            <div className="flex items-center gap-3 px-2 mb-8">
              <div className="w-9 h-9 rounded-xl bg-[#FF5500] flex items-center justify-center text-white font-black">
                <Icon name="zap" className="w-5 h-5" />
              </div>
              <span className="text-xl font-black tracking-tight text-white">RUNFLOW</span>
            </div>

            <nav className="flex-1 space-y-1">
              {navItems.map(item => (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition ${
                    activeTab === item.id
                      ? 'bg-[#FF5500] text-white shadow-lg shadow-[#FF5500]/20'
                      : 'text-zinc-400 hover:text-white hover:bg-[#15171E]'
                  }`}
                >
                  <Icon name={item.icon} className="w-4 h-4" />
                  {item.label}
                </button>
              ))}
            </nav>

            <div className="pt-4 border-t border-zinc-800/80">
              <div className="bg-[#15171E] rounded-2xl p-3.5 flex items-center gap-3">
                <div className="w-9 h-9 rounded-full bg-[#FF5500]/20 text-[#FF5500] font-bold flex items-center justify-center text-sm">
                  {(user?.name || 'C')[0].toUpperCase()}
                </div>
                <div className="min-w-0 flex-1">
                  <p className="text-sm font-bold text-white truncate">{user?.name}</p>
                  <p className="text-[11px] text-zinc-400 truncate">{user?.level}</p>
                </div>
              </div>
            </div>
          </aside>

          {/* Header Mobile */}
          <header className="lg:hidden sticky top-0 z-40 bg-[#0D0E12]/95 backdrop-blur border-b border-zinc-800 px-4 py-3 flex items-center justify-between">
            <div className="flex items-center gap-2.5">
              <div className="w-8 h-8 rounded-lg bg-[#FF5500] flex items-center justify-center text-white">
                <Icon name="zap" className="w-4 h-4" />
              </div>
              <span className="font-black text-lg tracking-tight">RUNFLOW</span>
            </div>
            <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="p-2 rounded-xl bg-[#15171E] text-zinc-200">
              <Icon name={mobileMenuOpen ? 'x' : 'menu'} className="w-5 h-5" />
            </button>
          </header>

          {mobileMenuOpen && (
            <div className="lg:hidden fixed inset-0 z-30 bg-[#070709]/95 pt-16 px-4 pb-6 overflow-y-auto">
              <div className="space-y-1.5">
                {navItems.map(item => (
                  <button
                    key={item.id}
                    onClick={() => { setActiveTab(item.id); setMobileMenuOpen(false); }}
                    className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-sm font-bold ${
                      activeTab === item.id ? 'bg-[#FF5500] text-white' : 'bg-[#15171E] text-zinc-300'
                    }`}
                  >
                    <Icon name={item.icon} className="w-4 h-4" />
                    {item.label}
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* Conteúdo Principal */}
          <main className="flex-1 lg:pl-64">
            <div className="max-w-6xl mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
              {user?.isDemo && (
                <div className="bg-amber-500/10 border border-amber-500/30 rounded-2xl px-4 py-2.5 flex flex-wrap items-center justify-between gap-2 text-xs text-amber-200">
                  <span className="flex items-center gap-2"><Icon name="info" className="w-4 h-4 text-amber-400" /> Você está visualizando dados de demonstração.</span>
                  <button onClick={() => { setActivities([]); setUser({...user, isDemo: false}); showToast('Dados de demonstração limpos!'); }} className="underline font-bold hover:text-white">
                    Limpar dados demo e começar do zero
                  </button>
                </div>
              )}

              {/* 1. DASHBOARD */}
              {activeTab === 'dashboard' && (
                <div className="space-y-6">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                      <p className="text-xs font-bold uppercase tracking-wider text-[#FF5500]">Painel de Performance</p>
                      <h1 className="text-2xl sm:text-3xl font-black text-white">Olá, {user?.name} 👋</h1>
                    </div>
                    <button
                      onClick={() => setActiveTab('run')}
                      className="bg-[#FF5500] hover:bg-[#FF6A1F] text-white font-bold px-5 py-3 rounded-2xl text-sm flex items-center gap-2 shadow-lg shadow-[#FF5500]/25 self-start"
                    >
                      <Icon name="play" className="w-4 h-4" /> Iniciar Corrida
                    </button>
                  </div>

                  {/* KPI Cards */}
                  <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    <div className="bg-[#0D0E12] border border-zinc-800/90 rounded-2xl p-5">
                      <span className="text-xs text-zinc-400 font-medium">Km na Semana</span>
                      <p className="text-2xl sm:text-3xl font-black text-white mt-1">{stats.weekKm.toFixed(1)} <span className="text-sm font-semibold text-zinc-500">km</span></p>
                      <span className="text-[11px] text-[#B8FF00] font-semibold mt-2 inline-block">{stats.weekCount} treinos nos últimos 7d</span>
                    </div>
                    <div className="bg-[#0D0E12] border border-zinc-800/90 rounded-2xl p-5">
                      <span className="text-xs text-zinc-400 font-medium">Distância Total</span>
                      <p className="text-2xl sm:text-3xl font-black text-white mt-1">{stats.totalKm.toFixed(1)} <span className="text-sm font-semibold text-zinc-500">km</span></p>
                      <span className="text-[11px] text-zinc-400 mt-2 inline-block">{activities.length} corridas registradas</span>
                    </div>
                    <div className="bg-[#0D0E12] border border-zinc-800/90 rounded-2xl p-5">
                      <span className="text-xs text-zinc-400 font-medium">Ritmo Médio Geral</span>
                      <p className="text-2xl sm:text-3xl font-black text-white mt-1">{stats.avgPace} <span className="text-sm font-semibold text-zinc-500">/km</span></p>
                      <span className="text-[11px] text-[#FF5500] font-semibold mt-2 inline-block">Melhor pace: {stats.bestPace}/km</span>
                    </div>
                    <div className="bg-[#0D0E12] border border-zinc-800/90 rounded-2xl p-5">
                      <span className="text-xs text-zinc-400 font-medium">Tempo Total Ativo</span>
                      <p className="text-2xl sm:text-3xl font-black text-white mt-1">{formatDuration(stats.totalSec)}</p>
                      <span className="text-[11px] text-zinc-400 mt-2 inline-block">Maior distância: {stats.longestRun.toFixed(1)} km</span>
                    </div>
                  </div>

                  {/* Meta Semanal & Próximo Treino */}
                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                    <div className="lg:col-span-2 bg-[#0D0E12] border border-zinc-800/90 rounded-2xl p-6 flex flex-col justify-between">
                      <div className="flex items-center justify-between mb-3">
                        <div>
                          <h3 className="font-bold text-white">Progresso da Meta Semanal</h3>
                          <p className="text-xs text-zinc-400">Objetivo atual: {weeklyGoal} km por semana</p>
                        </div>
                        <span className="text-lg font-black text-[#B8FF00]">{weeklyProgressPct}%</span>
                      </div>
                      <div className="w-full h-3.5 bg-[#15171E] rounded-full overflow-hidden">
                        <div style={{ width: `${weeklyProgressPct}%` }} className="h-full bg-gradient-to-r from-[#FF5500] to-[#B8FF00] rounded-full transition-all duration-500" />
                      </div>
                      <div className="flex justify-between text-xs text-zinc-400 mt-3">
                        <span>Percorrido: {stats.weekKm.toFixed(1)} km</span>
                        <span>Restante: {Math.max(weeklyGoal - stats.weekKm, 0).toFixed(1)} km</span>
                      </div>
                    </div>

                    <div className="bg-gradient-to-br from-[#181312] to-[#0D0E12] border border-[#FF5500]/40 rounded-2xl p-6">
                      <span className="text-[11px] font-bold uppercase tracking-wider text-[#FF5500]">Próximo Treino Recomendado</span>
                      <h3 className="font-bold text-white text-lg mt-1">
                        {user?.level === 'Iniciante' ? 'Caminhada + Trote Leve (25m)' : 'Rodagem Aeróbica Controlada (5 km)'}
                      </h3>
                      <p className="text-xs text-zinc-400 mt-1.5 mb-4">Mantenha zona confortável sem ofegar.</p>
                      <button onClick={() => setActiveTab('school')} className="text-xs font-bold text-white bg-[#FF5500] px-4 py-2 rounded-xl hover:bg-[#FF6A1F]">
                        Abrir na Escola de Corrida
                      </button>
                    </div>
                  </div>

                  {/* Gráficos */}
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                    <div className="bg-[#0D0E12] border border-zinc-800/90 rounded-2xl p-6">
                      <h3 className="font-bold text-white text-sm">Volume Semanal (km)</h3>
                      <p className="text-xs text-zinc-400">Evolução da distância nas últimas semanas</p>
                      <BarChartSVG data={chartWeeklyData} valueKey="km" labelKey="label" color="#FF5500" suffix=" km" />
                    </div>
                    <div className="bg-[#0D0E12] border border-zinc-800/90 rounded-2xl p-6">
                      <h3 className="font-bold text-white text-sm">Ritmo Médio (min/km)</h3>
                      <p className="text-xs text-zinc-400">Quanto menor a barra, mais rápido seu pace</p>
                      <BarChartSVG data={chartWeeklyData} valueKey="pace" labelKey="label" color="#B8FF00" suffix="" />
                    </div>
                  </div>

                  {/* Últimas Atividades */}
                  <div className="bg-[#0D0E12] border border-zinc-800/90 rounded-2xl p-6">
                    <div className="flex items-center justify-between mb-4">
                      <h3 className="font-bold text-white">Últimas Atividades</h3>
                      <button onClick={() => setActiveTab('history')} className="text-xs font-semibold text-[#FF5500] hover:underline">Ver todas</button>
                    </div>
                    {activities.length === 0 ? (
                      <div className="text-center py-8 text-zinc-500 text-sm">
                        Nenhuma corrida registrada ainda. Clique em <strong>Iniciar Corrida</strong> para registrar seu primeiro treino.
                      </div>
                    ) : (
                      <div className="space-y-2.5">
                        {activities.slice(0, 3).map(act => (
                          <div key={act.id} className="bg-[#15171E] rounded-xl p-4 flex flex-wrap items-center justify-between gap-3">
                            <div>
                              <p className="font-bold text-sm text-white">{act.title}</p>
                              <p className="text-xs text-zinc-400">{act.date} • {act.type}</p>
                            </div>
                            <div className="flex items-center gap-5 text-right">
                              <div>
                                <p className="text-sm font-black text-white">{act.distance} km</p>
                                <p className="text-[11px] text-zinc-500">Distância</p>
                              </div>
                              <div>
                                <p className="text-sm font-bold text-[#B8FF00]">{calcPace(act.distance, act.durationSec)} /km</p>
                                <p className="text-[11px] text-zinc-500">Ritmo</p>
                              </div>
                              <div>
                                <p className="text-sm font-semibold text-zinc-300">{formatDuration(act.durationSec)}</p>
                                <p className="text-[11px] text-zinc-500">Tempo</p>
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* 2. MINHA CORRIDA (GPS REAL + MANUAL + MAPA) */}
              {activeTab === 'run' && (
                <div className="space-y-6">
                  <div>
                    <h1 className="text-2xl font-black text-white">Minha Corrida & Percursos</h1>
                    <p className="text-sm text-zinc-400">Rastreamento GPS real pelo navegador ou registro manual detalhado.</p>
                  </div>

                  <div className="flex gap-2 bg-[#0D0E12] p-1.5 rounded-2xl border border-zinc-800 w-fit">
                    {[
                      { id: 'live', label: 'Cronômetro & GPS' },
                      { id: 'manual', label: editingId ? 'Editando Corrida' : 'Registro Manual' },
                      { id: 'map', label: 'Percursos Salvos' }
                    ].map(t => (
                      <button
                        key={t.id}
                        onClick={() => setRunTab(t.id)}
                        className={`px-4 py-2 rounded-xl text-xs font-bold transition ${runTab === t.id ? 'bg-[#FF5500] text-white' : 'text-zinc-400 hover:text-white'}`}
                      >
                        {t.label}
                      </button>
                    ))}
                  </div>

                  {runTab === 'live' && (
                    <div className="bg-[#0D0E12] border border-zinc-800 rounded-3xl p-8 text-center space-y-6">
                      <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-[#15171E] border border-zinc-700 text-xs text-zinc-300">
                        <span className={`w-2 h-2 rounded-full ${isRunning ? 'bg-[#B8FF00] animate-ping' : 'bg-zinc-500'}`} />
                        {gpsStatus}
                      </div>

                      <div>
                        <p className="text-xs uppercase tracking-widest text-zinc-500 font-bold">Tempo Decorrido</p>
                        <p className="text-5xl sm:text-7xl font-black tracking-tight text-white font-mono mt-1">{formatChrono(liveSeconds)}</p>
                      </div>

                      <div className="grid grid-cols-2 max-w-md mx-auto gap-4">
                        <div className="bg-[#15171E] rounded-2xl p-4">
                          <p className="text-xs text-zinc-400">Distância GPS</p>
                          <p className="text-2xl font-black text-white mt-0.5">{liveDistance.toFixed(2)} km</p>
                        </div>
                        <div className="bg-[#15171E] rounded-2xl p-4">
                          <p className="text-xs text-zinc-400">Ritmo Atual</p>
                          <p className="text-2xl font-black text-[#B8FF00] mt-0.5">{calcPace(liveDistance, liveSeconds)} /km</p>
                        </div>
                      </div>

                      <div className="flex flex-wrap items-center justify-center gap-3 pt-2">
                        {!isRunning ? (
                          <button onClick={() => setIsRunning(true)} className="bg-[#FF5500] hover:bg-[#FF6A1F] text-white font-bold px-8 py-4 rounded-2xl flex items-center gap-2 shadow-lg shadow-[#FF5500]/25">
                            <Icon name="play" className="w-5 h-5" /> {liveSeconds > 0 ? 'Retomar' : 'Iniciar Corrida'}
                          </button>
                        ) : (
                          <button onClick={() => setIsRunning(false)} className="bg-amber-500 hover:bg-amber-400 text-black font-bold px-8 py-4 rounded-2xl flex items-center gap-2">
                            <Icon name="pause" className="w-5 h-5" /> Pausar
                          </button>
                        )}
                        {liveSeconds > 0 && (
                          <button onClick={handleFinishLiveRun} className="bg-[#B8FF00] hover:brightness-110 text-black font-bold px-8 py-4 rounded-2xl flex items-center gap-2">
                            <Icon name="flag" className="w-5 h-5" /> Finalizar e Salvar
                          </button>
                        )}
                      </div>
                    </div>
                  )}

                  {runTab === 'manual' && (
                    <form onSubmit={handleSaveManualRun} className="bg-[#0D0E12] border border-zinc-800 rounded-3xl p-6 grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div className="sm:col-span-2">
                        <label className="block text-xs font-semibold text-zinc-400 mb-1">Nome da Atividade</label>
                        <input required value={manualForm.title} onChange={e => setManualForm({...manualForm, title: e.target.value})} placeholder="Ex: Corrida Matinal 5 km" className="w-full bg-[#15171E] border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-zinc-400 mb-1">Data</label>
                        <input type="date" required value={manualForm.date} onChange={e => setManualForm({...manualForm, date: e.target.value})} className="w-full bg-[#15171E] border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-zinc-400 mb-1">Distância (km)</label>
                        <input type="number" step="0.01" required value={manualForm.distance} onChange={e => setManualForm({...manualForm, distance: e.target.value})} placeholder="5.00" className="w-full bg-[#15171E] border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-zinc-400 mb-1">Duração (Minutos)</label>
                        <input type="number" required value={manualForm.minutes} onChange={e => setManualForm({...manualForm, minutes: e.target.value})} placeholder="28" className="w-full bg-[#15171E] border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-zinc-400 mb-1">Segundos</label>
                        <input type="number" min="0" max="59" value={manualForm.seconds} onChange={e => setManualForm({...manualForm, seconds: e.target.value})} className="w-full bg-[#15171E] border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-zinc-400 mb-1">Tipo de Treino</label>
                        <select value={manualForm.type} onChange={e => setManualForm({...manualForm, type: e.target.value})} className="w-full bg-[#15171E] border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white">
                          <option>Rodagem</option>
                          <option>Tiros / Velocidade</option>
                          <option>Longão</option>
                          <option>Regenerativo</option>
                          <option>Prova</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-zinc-400 mb-1">Sensação</label>
                        <select value={manualForm.feeling} onChange={e => setManualForm({...manualForm, feeling: e.target.value})} className="w-full bg-[#15171E] border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white">
                          <option>Excelente</option>
                          <option>Bom</option>
                          <option>Moderado</option>
                          <option>Cansado</option>
                        </select>
                      </div>
                      <div className="sm:col-span-2">
                        <label className="block text-xs font-semibold text-zinc-400 mb-1">Observações</label>
                        <textarea rows="2" value={manualForm.notes} onChange={e => setManualForm({...manualForm, notes: e.target.value})} placeholder="Como foi o ritmo, clima ou terreno?" className="w-full bg-[#15171E] border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                      </div>
                      <div className="sm:col-span-2 flex gap-3">
                        <button type="submit" className="bg-[#FF5500] hover:bg-[#FF6A1F] text-white font-bold px-6 py-3 rounded-xl text-sm">
                          {editingId ? 'Salvar Alterações' : 'Registrar Corrida'}
                        </button>
                        {editingId && (
                          <button type="button" onClick={() => { setEditingId(null); setManualForm({ title: '', date: new Date().toISOString().split('T')[0], distance: '', minutes: '', seconds: '0', type: 'Rodagem', feeling: 'Bom', notes: '' }); }} className="bg-zinc-800 text-zinc-300 font-semibold px-4 py-3 rounded-xl text-sm">
                            Cancelar
                          </button>
                        )}
                      </div>
                    </form>
                  )}

                  {runTab === 'map' && (
                    <div className="bg-[#0D0E12] border border-zinc-800 rounded-3xl p-6 space-y-4">
                      <h3 className="font-bold text-white">Histórico de Rotas & Coordenadas</h3>
                      <p className="text-xs text-zinc-400">Arquitetura preparada para integração Mapbox / Google Maps API. Exibindo coordenadas reais capturadas pelo GPS.</p>
                      {activities.filter(a => a.route && a.route.length > 0).length === 0 ? (
                        <p className="text-sm text-zinc-500 py-6">Nenhuma rota GPS salva ainda. Use a aba "Cronômetro & GPS" durante sua corrida externa.</p>
                      ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          {activities.filter(a => a.route && a.route.length > 0).map(act => (
                            <div key={act.id} className="bg-[#15171E] rounded-2xl p-4 border border-zinc-800">
                              <p className="font-bold text-white text-sm">{act.title}</p>
                              <p className="text-xs text-zinc-400 mt-0.5">{act.distance} km • {act.route.length} pontos GPS</p>
                              <div className="mt-3 text-[11px] font-mono text-zinc-400 bg-[#0D0E12] p-3 rounded-xl space-y-1">
                                <p className="text-[#B8FF00]">Início: {act.route[0].lat.toFixed(5)}, {act.route[0].lng.toFixed(5)}</p>
                                <p className="text-[#FF5500]">Término: {act.route[act.route.length-1].lat.toFixed(5)}, {act.route[act.route.length-1].lng.toFixed(5)}</p>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              )}

              {/* 3. ESCOLA DE CORRIDA */}
              {activeTab === 'school' && (
                <div className="space-y-6">
                  <div>
                    <span className="text-xs font-bold uppercase tracking-wider text-[#B8FF00]">Metodologia Progressiva</span>
                    <h1 className="text-2xl font-black text-white">Escola de Corrida RUNFLOW</h1>
                    <p className="text-sm text-zinc-400">Escolha um programa estruturado e marque cada treino concluído.</p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    {PROGRAMS.map(prog => (
                      <button
                        key={prog.id}
                        onClick={() => setSelectedProgram(prog)}
                        className={`text-left p-4 rounded-2xl border transition ${
                          selectedProgram.id === prog.id
                            ? 'bg-[#181312] border-[#FF5500] text-white'
                            : 'bg-[#0D0E12] border-zinc-800 text-zinc-300 hover:border-zinc-700'
                        }`}
                      >
                        <span className="text-[11px] font-bold text-[#FF5500]">{prog.duration} • {prog.level}</span>
                        <h3 className="font-bold text-sm mt-1">{prog.title}</h3>
                      </button>
                    ))}
                  </div>

                  <div className="bg-[#0D0E12] border border-zinc-800 rounded-3xl p-6 space-y-5">
                    <div className="flex flex-wrap items-start justify-between gap-4 border-b border-zinc-800 pb-5">
                      <div>
                        <h2 className="text-xl font-black text-white">{selectedProgram.title}</h2>
                        <p className="text-sm text-zinc-400 mt-1">{selectedProgram.description}</p>
                        <div className="flex flex-wrap gap-3 mt-3 text-xs">
                          <span className="bg-[#15171E] px-3 py-1 rounded-lg text-zinc-300">🎯 {selectedProgram.goal}</span>
                          <span className="bg-[#15171E] px-3 py-1 rounded-lg text-zinc-300">📅 {selectedProgram.workoutsCount} treinos totais</span>
                        </div>
                      </div>
                    </div>

                    <div className="space-y-4">
                      {selectedProgram.weeks.map(w => (
                        <div key={w.week} className="bg-[#15171E] rounded-2xl p-5 space-y-3">
                          <h4 className="font-bold text-sm text-[#B8FF00]">Semana {w.week} — {w.title}</h4>
                          <div className="space-y-2.5">
                            {w.sessions.map(sess => {
                              const done = completedSessions.includes(sess.id);
                              return (
                                <div key={sess.id} className="bg-[#0D0E12] border border-zinc-800/80 rounded-xl p-4 flex items-start justify-between gap-4">
                                  <div>
                                    <p className={`font-bold text-sm ${done ? 'line-through text-zinc-500' : 'text-white'}`}>{sess.name}</p>
                                    <p className="text-xs text-zinc-400 mt-1">{sess.detail}</p>
                                  </div>
                                  <button
                                    onClick={() => toggleSessionComplete(sess.id)}
                                    className={`px-3.5 py-2 rounded-xl text-xs font-bold shrink-0 transition ${
                                      done ? 'bg-[#B8FF00]/20 text-[#B8FF00]' : 'bg-[#FF5500] text-white hover:bg-[#FF6A1F]'
                                    }`}
                                  >
                                    {done ? 'Concluído ✓' : 'Concluir'}
                                  </button>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* 4. MEU TREINADOR IA */}
              {activeTab === 'coach' && (
                <div className="space-y-4">
                  <div>
                    <h1 className="text-2xl font-black text-white">Meu Treinador Inteligente</h1>
                    <p className="text-sm text-zinc-400">Análise baseada exclusivamente nos seus registros reais e recomendações seguras.</p>
                  </div>

                  <div className="bg-[#0D0E12] border border-zinc-800 rounded-3xl p-5 flex flex-col h-[500px]">
                    <div className="flex-1 overflow-y-auto space-y-3 pr-1">
                      {chatMessages.map((m, i) => (
                        <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                          <div className={`max-w-[85%] rounded-2xl px-4 py-3 text-sm leading-relaxed ${
                            m.role === 'user' ? 'bg-[#FF5500] text-white font-medium' : 'bg-[#15171E] text-zinc-200 border border-zinc-800'
                          }`}>
                            {m.text}
                          </div>
                        </div>
                      ))}
                    </div>

                    <div className="flex flex-wrap gap-2 py-3 border-t border-zinc-800/80">
                      {['Analisar meu histórico', 'Qual meu próximo treino?', 'Como melhorar meu pace?', 'Estou sentindo dor no joelho'].map(q => (
                        <button key={q} onClick={() => handleSendChat(q)} className="text-xs bg-[#15171E] hover:bg-zinc-800 text-zinc-300 px-3 py-1.5 rounded-full border border-zinc-700/70">
                          {q}
                        </button>
                      ))}
                    </div>

                    <form onSubmit={e => { e.preventDefault(); handleSendChat(); }} className="flex gap-2">
                      <input
                        value={chatInput}
                        onChange={e => setChatInput(e.target.value)}
                        placeholder="Pergunte sobre ritmo, recuperação ou próximo treino..."
                        className="flex-1 bg-[#15171E] border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#FF5500]"
                      />
                      <button type="submit" className="bg-[#FF5500] hover:bg-[#FF6A1F] text-white font-bold px-5 rounded-xl">
                        Enviar
                      </button>
                    </form>
                  </div>
                </div>
              )}

              {/* 5. HISTÓRICO E RELATÓRIOS */}
              {activeTab === 'history' && (
                <div className="space-y-6">
                  <div className="flex flex-wrap items-center justify-between gap-4">
                    <div>
                      <h1 className="text-2xl font-black text-white">Histórico & Relatórios</h1>
                      <p className="text-sm text-zinc-400">Filtre, inspecione, edite ou exclua suas atividades.</p>
                    </div>
                    <div className="flex gap-2">
                      <select value={filterType} onChange={e => setFilterType(e.target.value)} className="bg-[#0D0E12] border border-zinc-800 rounded-xl px-3.5 py-2 text-xs text-white">
                        <option value="Todos">Todos os tipos</option>
                        <option>Rodagem</option>
                        <option>Tiros / Velocidade</option>
                        <option>Longão</option>
                        <option>Regenerativo</option>
                        <option>Prova</option>
                      </select>
                      <input type="number" placeholder="Dist. mín (km)" value={filterMinDist} onChange={e => setFilterMinDist(e.target.value)} className="w-32 bg-[#0D0E12] border border-zinc-800 rounded-xl px-3.5 py-2 text-xs text-white" />
                    </div>
                  </div>

                  {/* Resumo Relatório */}
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                    <div className="bg-[#0D0E12] border border-zinc-800 rounded-2xl p-4">
                      <span className="text-xs text-zinc-400">Total Acumulado</span>
                      <p className="text-xl font-black text-white mt-1">{stats.totalKm.toFixed(2)} km</p>
                    </div>
                    <div className="bg-[#0D0E12] border border-zinc-800 rounded-2xl p-4">
                      <span className="text-xs text-zinc-400">Horas Totais</span>
                      <p className="text-xl font-black text-white mt-1">{(stats.totalSec / 3600).toFixed(1)} h</p>
                    </div>
                    <div className="bg-[#0D0E12] border border-zinc-800 rounded-2xl p-4">
                      <span className="text-xs text-zinc-400">Ritmo Médio</span>
                      <p className="text-xl font-black text-[#B8FF00] mt-1">{stats.avgPace} /km</p>
                    </div>
                    <div className="bg-[#0D0E12] border border-zinc-800 rounded-2xl p-4">
                      <span className="text-xs text-zinc-400">Melhor Pace</span>
                      <p className="text-xl font-black text-[#FF5500] mt-1">{stats.bestPace} /km</p>
                    </div>
                  </div>

                  <div className="space-y-3">
                    {activities
                      .filter(a => filterType === 'Todos' || a.type === filterType)
                      .filter(a => !filterMinDist || a.distance >= Number(filterMinDist))
                      .map(act => (
                        <div key={act.id} className="bg-[#0D0E12] border border-zinc-800 rounded-2xl p-5 flex flex-wrap items-center justify-between gap-4">
                          <div className="space-y-1">
                            <div className="flex items-center gap-2">
                              <h3 className="font-bold text-white">{act.title}</h3>
                              <span className="text-[11px] bg-[#15171E] text-zinc-300 px-2.5 py-0.5 rounded-full">{act.type}</span>
                            </div>
                            <p className="text-xs text-zinc-400">{act.date} • Sensação: {act.feeling || 'Boa'} • ~{act.calories} kcal</p>
                            {act.notes && <p className="text-xs text-zinc-500 italic">"{act.notes}"</p>}
                          </div>

                          <div className="flex items-center gap-6">
                            <div className="text-right">
                              <p className="text-base font-black text-white">{act.distance} km</p>
                              <p className="text-xs text-[#B8FF00] font-semibold">{calcPace(act.distance, act.durationSec)} /km ({calcSpeed(act.distance, act.durationSec)} km/h)</p>
                            </div>
                            <div className="flex gap-1.5">
                              <button onClick={() => handleEditActivity(act)} className="p-2 rounded-xl bg-[#15171E] hover:text-[#FF5500] text-zinc-400" title="Editar">
                                <Icon name="edit-2" className="w-4 h-4" />
                              </button>
                              <button onClick={() => handleDeleteActivity(act.id)} className="p-2 rounded-xl bg-[#15171E] hover:text-red-400 text-zinc-400" title="Excluir">
                                <Icon name="trash-2" className="w-4 h-4" />
                              </button>
                            </div>
                          </div>
                        </div>
                      ))}
                  </div>
                </div>
              )}

              {/* 6. METAS E DESAFIOS */}
              {activeTab === 'goals' && (
                <div className="space-y-6">
                  <div>
                    <h1 className="text-2xl font-black text-white">Metas & Desafios</h1>
                    <p className="text-sm text-zinc-400">Acompanhe seus objetivos ativos e crie novas metas personalizadas.</p>
                  </div>

                  <form
                    onSubmit={e => {
                      e.preventDefault();
                      if (!newGoalTitle || !newGoalTarget) return;
                      setGoals(prev => [...prev, { id: 'g-' + Date.now(), title: newGoalTitle, target: Number(newGoalTarget), unit: 'km', type: 'total' }]);
                      setNewGoalTitle('');
                      setNewGoalTarget('');
                      showToast('Nova meta adicionada!');
                    }}
                    className="bg-[#0D0E12] border border-zinc-800 rounded-2xl p-4 flex flex-wrap gap-3"
                  >
                    <input value={newGoalTitle} onChange={e => setNewGoalTitle(e.target.value)} placeholder="Ex: Correr 30 km acumulados" className="flex-1 min-w-[200px] bg-[#15171E] border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                    <input type="number" value={newGoalTarget} onChange={e => setNewGoalTarget(e.target.value)} placeholder="Alvo (km)" className="w-32 bg-[#15171E] border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                    <button type="submit" className="bg-[#FF5500] text-white font-bold px-5 py-2.5 rounded-xl text-sm">Criar Meta</button>
                  </form>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {goals.map(g => {
                      const current = g.type === 'weekly' ? stats.weekKm : g.type === 'single' ? stats.longestRun : stats.totalKm;
                      const pct = Math.min(Math.round((current / g.target) * 100), 100);
                      return (
                        <div key={g.id} className="bg-[#0D0E12] border border-zinc-800 rounded-2xl p-5 space-y-3">
                          <div className="flex justify-between items-center">
                            <h3 className="font-bold text-white">{g.title}</h3>
                            <span className="text-xs font-black text-[#B8FF00]">{pct}%</span>
                          </div>
                          <div className="w-full h-2.5 bg-[#15171E] rounded-full overflow-hidden">
                            <div style={{ width: `${pct}%` }} className="h-full bg-[#FF5500] rounded-full" />
                          </div>
                          <p className="text-xs text-zinc-400">{current.toFixed(1)} / {g.target} {g.unit}</p>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* 7. COMUNIDADE */}
              {activeTab === 'community' && (
                <div className="space-y-6">
                  <div>
                    <h1 className="text-2xl font-black text-white">Comunidade RUNFLOW</h1>
                    <p className="text-sm text-zinc-400">Inspire-se com outros corredores, dê kudos e acompanhe o ranking semanal.</p>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div className="lg:col-span-2 space-y-4">
                      {communityPosts.map(post => (
                        <div key={post.id} className="bg-[#0D0E12] border border-zinc-800 rounded-2xl p-5 space-y-3">
                          <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-full bg-[#FF5500]/20 text-[#FF5500] font-bold flex items-center justify-center text-xs">{post.avatar}</div>
                            <div>
                              <p className="font-bold text-sm text-white">{post.user}</p>
                              <p className="text-[11px] text-zinc-500">{post.time}</p>
                            </div>
                          </div>
                          <h4 className="font-bold text-white">{post.title}</h4>
                          <div className="flex gap-6 bg-[#15171E] p-3.5 rounded-xl text-sm">
                            <div><span className="text-xs text-zinc-400 block">Distância</span><strong>{post.distance} km</strong></div>
                            <div><span className="text-xs text-zinc-400 block">Pace</span><strong className="text-[#B8FF00]">{post.pace}</strong></div>
                          </div>
                          <div className="flex items-center gap-4 pt-1">
                            <button
                              onClick={() => setCommunityPosts(prev => prev.map(p => p.id === post.id ? { ...p, liked: !p.liked, likes: p.liked ? p.likes - 1 : p.likes + 1 } : p))}
                              className={`text-xs font-bold flex items-center gap-1.5 px-3 py-1.5 rounded-lg ${post.liked ? 'bg-[#FF5500] text-white' : 'bg-[#15171E] text-zinc-300'}`}
                            >
                              <Icon name="thumbs-up" className="w-3.5 h-3.5" /> Kudos ({post.likes})
                            </button>
                            <span className="text-xs text-zinc-500">{post.comments.length} comentários</span>
                          </div>
                        </div>
                      ))}
                    </div>

                    <div className="bg-[#0D0E12] border border-zinc-800 rounded-2xl p-5 h-fit space-y-4">
                      <h3 className="font-bold text-white flex items-center gap-2"><Icon name="trophy" className="w-4 h-4 text-[#B8FF00]" /> Ranking Semanal</h3>
                      <div className="space-y-2.5 text-sm">
                        <div className="flex justify-between p-2.5 rounded-xl bg-[#15171E]"><span>1. Rafael Mendes</span><strong className="text-[#B8FF00]">34.0 km</strong></div>
                        <div className="flex justify-between p-2.5 rounded-xl bg-[#15171E]"><span>2. Mariana Costa</span><strong>26.5 km</strong></div>
                        <div className="flex justify-between p-2.5 rounded-xl bg-[#FF5500]/15 border border-[#FF5500]/40"><span>3. {user?.name} (Você)</span><strong>{stats.weekKm.toFixed(1)} km</strong></div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* 8. PERFIL & CONQUISTAS */}
              {activeTab === 'profile' && (
                <div className="space-y-6">
                  <div className="bg-[#0D0E12] border border-zinc-800 rounded-3xl p-6 flex flex-wrap items-center justify-between gap-4">
                    <div className="flex items-center gap-4">
                      <div className="w-16 h-16 rounded-2xl bg-[#FF5500] text-white font-black text-2xl flex items-center justify-center">
                        {(user?.name || 'C')[0].toUpperCase()}
                      </div>
                      <div>
                        <h1 className="text-2xl font-black text-white">{user?.name}</h1>
                        <p className="text-sm text-zinc-400">{user?.level} • Objetivo: {user?.goal}</p>
                        <p className="text-xs text-zinc-500 mt-1">Meta semanal: {user?.weeklyGoalKm} km • {user?.daysPerWeek}x/semana</p>
                      </div>
                    </div>
                    <button onClick={() => { setUser(null); setAuthStep('login'); }} className="bg-zinc-800 hover:bg-red-950 hover:text-red-300 text-zinc-300 text-xs font-bold px-4 py-2.5 rounded-xl">
                      Sair da Conta
                    </button>
                  </div>

                  <div>
                    <h2 className="text-lg font-bold text-white mb-3">Estante de Medalhas & Conquistas</h2>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                      {ACHIEVEMENTS_LIST.map(ach => {
                        const unlocked = ach.check(activities);
                        return (
                          <div key={ach.id} className={`rounded-2xl p-5 border transition ${unlocked ? 'bg-[#0D0E12] border-[#B8FF00]/50' : 'bg-[#0D0E12]/50 border-zinc-800/60 opacity-50'}`}>
                            <div className={`w-10 h-10 rounded-xl flex items-center justify-center mb-3 ${unlocked ? 'bg-[#B8FF00] text-black' : 'bg-zinc-800 text-zinc-500'}`}>
                              <Icon name={ach.icon} className="w-5 h-5" />
                            </div>
                            <h3 className="font-bold text-white text-sm">{ach.title}</h3>
                            <p className="text-xs text-zinc-400 mt-1">{ach.desc}</p>
                            <span className={`inline-block mt-3 text-[11px] font-bold ${unlocked ? 'text-[#B8FF00]' : 'text-zinc-500'}`}>
                              {unlocked ? 'Desbloqueada ✓' : 'Bloqueada'}
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              )}

              {/* 9. CONFIGURAÇÕES & BANCO DE DADOS SUPABASE */}
              {activeTab === 'settings' && (
                <div className="space-y-6">
                  <div>
                    <h1 className="text-2xl font-black text-white">Configurações & Arquitetura Supabase</h1>
                    <p className="text-sm text-zinc-400">Schema PostgreSQL pronto para produção com políticas Row Level Security (RLS).</p>
                  </div>

                  <div className="bg-[#0D0E12] border border-zinc-800 rounded-2xl p-6 space-y-4">
                    <div className="flex items-center justify-between">
                      <h3 className="font-bold text-white text-sm">SQL Schema (profiles, activities, goals + RLS)</h3>
                      <button
                        onClick={() => { navigator.clipboard.writeText(SUPABASE_SQL); showToast('SQL copiado para a área de transferência!'); }}
                        className="bg-[#FF5500] text-white text-xs font-bold px-3.5 py-2 rounded-xl"
                      >
                        Copiar SQL
                      </button>
                    </div>
                    <pre className="bg-[#070709] border border-zinc-800 rounded-xl p-4 text-xs text-zinc-300 overflow-x-auto font-mono">
                      {SUPABASE_SQL}
                    </pre>
                  </div>
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

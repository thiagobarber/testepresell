<!DOCTYPE html>
<html lang="es-ES">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aura Finance | Gestión y Asistente Financiero Personal</title>
  
  <!-- Tipografía Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              200: '#bbf7d0',
              300: '#86efac',
              400: '#4ade80',
              500: '#10b981', // Verde financiero principal
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
            },
            surface: {
              light: '#F8FAFC',
              card: '#FFFFFF',
              dark: '#0F172A',
              darkcard: '#1E293B',
              darkborder: '#334155'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js para visualización de datos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    /* Estilos base y transiciones suaves */
    * {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      background-color: #f8fafc;
      color: #0f172a;
      overflow-x: hidden;
    }
    .dark body {
      background-color: #0b1120;
      color: #f8fafc;
    }
    /* Scrollbar minimalista */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #334155;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-surface-light dark:bg-[#0B1120] text-slate-800 dark:text-slate-100 transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // =========================================================================
    // 1. UTILIDADES Y FORMATEO ESPAÑOL DE ESPAÑA
    // =========================================================================
    const formatEUR = (amount) => {
      const val = Number(amount) || 0;
      return new Intl.NumberFormat('es-ES', {
        style: 'currency',
        currency: 'EUR',
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      }).format(val);
    };

    const formatDateES = (dateStr) => {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      return new Intl.DateTimeFormat('es-ES', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      }).format(d);
    };

    const CATEGORIES = {
      housing: { name: 'Vivienda', icon: '🏠', color: '#3B82F6' },
      food: { name: 'Alimentación', icon: '🍔', color: '#10B981' },
      transport: { name: 'Transporte', icon: '🚗', color: '#F59E0B' },
      leisure: { name: 'Ocio', icon: '🎮', color: '#EC4899' },
      subscriptions: { name: 'Suscripciones', icon: '💳', color: '#8B5CF6' },
      health: { name: 'Salud', icon: '🏥', color: '#EF4444' },
      education: { name: 'Educación', icon: '📚', color: '#06B6D4' },
      shopping: { name: 'Compras', icon: '🛍', color: '#F97316' },
      technology: { name: 'Tecnología', icon: '📱', color: '#6366F1' },
      savings: { name: 'Ahorro', icon: '💰', color: '#059669' },
      investment: { name: 'Inversión', icon: '📈', color: '#14B8A6' },
      debt: { name: 'Deudas', icon: '⚖️', color: '#DC2626' },
      salary: { name: 'Nómina', icon: '💼', color: '#10B981' },
      extra: { name: 'Ingresos extras', icon: '✨', color: '#34D399' }
    };

    // =========================================================================
    // 2. CAPA DE PERSISTENCIA Y SERVICIOS (LISTA PARA BACKEND)
    // =========================================================================
    const STORAGE_KEY = 'aura_finance_master_data_v1';

    const INITIAL_DEMO_DATA = {
      user: {
        id: 'usr_demo_101',
        name: 'Alejandro',
        surname: 'Martínez',
        email: 'alejandro.martinez@ejemplo.es',
        currency: 'EUR',
        plan: 'pro',
        country: 'España',
        theme: 'light',
        onboardingCompleted: true
      },
      transactions: [
        { id: 'tx_1', concept: 'Nómina mensual', amount: 2850.00, type: 'income', category: 'salary', date: '2026-10-01', account: 'Cuenta Nómina BBVA', notes: 'Mes en curso' },
        { id: 'tx_2', concept: 'Hipoteca vivienda', amount: 720.00, type: 'expense', category: 'housing', date: '2026-10-02', account: 'Cuenta Nómina BBVA', notes: 'Cuota fija mensual' },
        { id: 'tx_3', concept: 'Compra Mercadona', amount: 168.45, type: 'expense', category: 'food', date: '2026-10-03', account: 'Tarjeta Visa Débito', notes: 'Alimentación semanal' },
        { id: 'tx_4', concept: 'Abono Transporte Renfe', amount: 54.60, type: 'expense', category: 'transport', date: '2026-10-04', account: 'Tarjeta Visa Débito', notes: 'Mensual' },
        { id: 'tx_5', concept: 'Restaurante fin de semana', amount: 84.00, type: 'expense', category: 'leisure', date: '2026-10-05', account: 'Tarjeta Visa Débito', notes: 'Cena amigos' },
        { id: 'tx_6', concept: 'Suscripción Netflix & Spotify', amount: 27.98, type: 'expense', category: 'subscriptions', date: '2026-10-06', account: 'Cuenta Nómina BBVA', notes: 'Servicios de streaming' },
        { id: 'tx_7', concept: 'Gimnasio mensual', amount: 39.90, type: 'expense', category: 'health', date: '2026-10-07', account: 'Cuenta Nómina BBVA', notes: 'Cuota club deportivo' },
        { id: 'tx_8', concept: 'Ingreso freelance consultoría', amount: 450.00, type: 'income', category: 'extra', date: '2026-10-08', account: 'Cuenta Nómina BBVA', notes: 'Proyecto web auxiliar' },
        { id: 'tx_9', concept: 'Aportación Fondo Inversión Indexado', amount: 300.00, type: 'expense', category: 'investment', date: '2026-10-09', account: 'MyInvestor', notes: 'MSCI World ETF' },
        { id: 'tx_10', concept: 'Factura Fibra y Móvil O2', amount: 38.00, type: 'expense', category: 'housing', date: '2026-10-10', account: 'Cuenta Nómina BBVA', notes: 'Internet doméstico' }
      ],
      budgets: [
        { category: 'housing', limit: 800 },
        { category: 'food', limit: 400 },
        { category: 'transport', limit: 120 },
        { category: 'leisure', limit: 200 },
        { category: 'subscriptions', limit: 50 },
        { category: 'health', limit: 80 }
      ],
      goals: [
        { id: 'goal_1', name: 'Fondo de emergencia (6 meses)', target: 8400, current: 4800, deadline: '2027-04-30', category: 'emergency', priority: 'high', icon: '🛡️' },
        { id: 'goal_2', name: 'Viaje a Japón en otoño', target: 4500, current: 2150, deadline: '2027-10-31', category: 'travel', priority: 'medium', icon: '✈️' },
        { id: 'goal_3', name: 'Entrada para compra de piso', target: 35000, current: 11200, deadline: '2029-12-31', category: 'housing', priority: 'high', icon: '🏠' },
        { id: 'goal_4', name: 'Coche híbrido enchufable', target: 12000, current: 3400, deadline: '2028-06-30', category: 'car', priority: 'low', icon: '🚗' }
      ],
      debts: [
        { id: 'debt_1', name: 'Préstamo vehículo', total: 6400, remaining: 3800, monthlyPayment: 195, interestRate: 6.2, endDate: '2028-05-15', type: 'Préstamo personal' },
        { id: 'debt_2', name: 'Tarjeta de crédito aplazado', total: 1200, remaining: 450, monthlyPayment: 75, interestRate: 14.5, endDate: '2027-04-01', type: 'Tarjeta revolving' }
      ],
      investments: [
        { id: 'inv_1', name: 'Vanguard Global Stock Index (MyInvestor)', type: 'Fondo Indexado', invested: 7500, current: 8940, returnRate: 19.2 },
        { id: 'inv_2', name: 'Cuenta Remunerada Trade Republic 3,75%', type: 'Cuenta Remunerada', invested: 4500, current: 4625, returnRate: 2.78 },
        { id: 'inv_3', name: 'Letras del Tesoro Español 12m', type: 'Renta Fija Pública', invested: 3000, current: 3095, returnRate: 3.16 }
      ],
      habits: [
        { id: 'h_1', title: 'Registrar gastos del día', streak: 14, completedToday: true },
        { id: 'h_2', title: 'Revisar suscripciones inactivas', streak: 3, completedToday: true },
        { id: 'h_3', title: 'Págate a ti primero (Ahorro inicial)', streak: 8, completedToday: true },
        { id: 'h_4', title: 'Comprobar saldo semanal los domingos', streak: 21, completedToday: false }
      ],
      notifications: [
        { id: 'n_1', title: 'Presupuesto de Alimentación', message: 'Has alcanzado el 42% del límite mensual fijado.', type: 'info', time: 'Hace 2 horas', read: false },
        { id: 'n_2', title: 'Objetivo Viaje a Japón', message: '¡Estás a menos de 2.350 € de completar el objetivo!', type: 'success', time: 'Ayer', read: false },
        { id: 'n_3', title: 'Vencimiento de cuota', message: 'El 15 de este mes se pasará la cuota de tu préstamo (195,00 €).', type: 'warning', time: 'Hace 3 días', read: true }
      ]
    };

    // Capa de abstracción de almacenamiento (Database Adapter)
    const db = {
      get: () => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(INITIAL_DEMO_DATA));
            return INITIAL_DEMO_DATA;
          }
          return JSON.parse(raw);
        } catch (e) {
          console.error('Error accediendo a almacenamiento local:', e);
          return INITIAL_DEMO_DATA;
        }
      },
      set: (data) => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e) {
          console.error('Error guardando en almacenamiento:', e);
        }
      },
      reset: () => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(INITIAL_DEMO_DATA));
        return INITIAL_DEMO_DATA;
      }
    };

    // =========================================================================
    // 3. COMPONENTE ICONOS LUCIDE SEGURO
    // =========================================================================
    const Icon = ({ name, size = 18, className = "" }) => {
      const containerRef = useRef(null);
      useEffect(() => {
        if (window.lucide && containerRef.current) {
          containerRef.current.innerHTML = `<i data-lucide="${name}" class="${className}" style="width:${size}px; height:${size}px;"></i>`;
          window.lucide.createIcons({
            root: containerRef.current
          });
        }
      }, [name, size, className]);
      return <span ref={containerRef} className={`inline-flex items-center justify-center align-middle ${className}`} />;
    };

    // =========================================================================
    // 4. COMPONENTES UI REUTILIZABLES (DESIGN SYSTEM)
    // =========================================================================
    const Card = ({ children, className = "", title, subtitle, action }) => (
      <div className={`bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-5 md:p-6 shadow-sm shadow-slate-100 dark:shadow-none transition-all ${className}`}>
        {(title || action) && (
          <div className="flex items-center justify-between mb-4">
            <div>
              {title && <h3 className="font-semibold text-slate-900 dark:text-white text-base tracking-tight">{title}</h3>}
              {subtitle && <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">{subtitle}</p>}
            </div>
            {action && <div>{action}</div>}
          </div>
        )}
        {children}
      </div>
    );

    const StatCard = ({ title, value, detail, icon, trend, trendValue, badgeColor = "brand" }) => (
      <Card className="hover:border-slate-300 dark:hover:border-slate-700 transition-colors">
        <div className="flex items-start justify-between">
          <div>
            <p className="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-1">{title}</p>
            <h4 className="text-2xl lg:text-3xl font-bold tracking-tight text-slate-900 dark:text-white">{value}</h4>
          </div>
          <div className="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-100 dark:border-slate-700">
            <Icon name={icon} size={20} />
          </div>
        </div>
        {(detail || trend) && (
          <div className="mt-3 flex items-center gap-2 text-xs">
            {trend && (
              <span className={`inline-flex items-center font-medium ${trend === 'up' ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}`}>
                <Icon name={trend === 'up' ? 'arrow-up-right' : 'arrow-down-right'} size={14} className="mr-0.5" />
                {trendValue}
              </span>
            )}
            <span className="text-slate-500 dark:text-slate-400">{detail}</span>
          </div>
        )}
      </Card>
    );

    const Button = ({ children, variant = "primary", size = "md", onClick, disabled, className = "", type = "button", icon }) => {
      const base = "inline-flex items-center justify-center font-medium rounded-xl transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed";
      const sizes = {
        sm: "px-3 py-1.5 text-xs gap-1.5",
        md: "px-4 py-2 text-sm gap-2",
        lg: "px-5 py-2.5 text-base gap-2.5"
      };
      const variants = {
        primary: "bg-emerald-600 hover:bg-emerald-700 text-white focus:ring-emerald-500 shadow-sm shadow-emerald-600/20 active:scale-[0.98]",
        secondary: "bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 focus:ring-slate-400",
        outline: "border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800/60 text-slate-700 dark:text-slate-300 focus:ring-slate-300",
        danger: "bg-rose-600 hover:bg-rose-700 text-white focus:ring-rose-500 shadow-sm",
        ghost: "hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-400"
      };
      return (
        <button
          type={type}
          onClick={onClick}
          disabled={disabled}
          className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}
        >
          {icon && <Icon name={icon} size={size === 'sm' ? 14 : size === 'lg' ? 18 : 16} />}
          {children}
        </button>
      );
    };

    const ProgressBar = ({ value, max, color = "bg-emerald-500", showLabel = false, height = "h-2" }) => {
      const percentage = Math.min(100, Math.max(0, Math.round((value / max) * 100))) || 0;
      return (
        <div className="w-full">
          <div className={`w-full bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden ${height}`}>
            <div
              className={`h-full ${color} rounded-full transition-all duration-500 ease-out`}
              style={{ width: `${percentage}%` }}
            />
          </div>
          {showLabel && (
            <div className="flex justify-between items-center text-xs text-slate-500 dark:text-slate-400 mt-1.5">
              <span>{percentage}% completado</span>
              <span>{formatEUR(value)} de {formatEUR(max)}</span>
            </div>
          )}
        </div>
      );
    };

    const Modal = ({ isOpen, onClose, title, children, maxWidth = "max-w-lg" }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="fixed inset-0" onClick={onClose}></div>
          <div className={`relative bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl w-full ${maxWidth} p-6 shadow-2xl z-10 animate-in fade-in zoom-in-95 duration-150`}>
            <div className="flex items-center justify-between pb-4 mb-4 border-b border-slate-100 dark:border-slate-800">
              <h3 className="text-lg font-bold text-slate-900 dark:text-white">{title}</h3>
              <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800">
                <Icon name="x" size={18} />
              </button>
            </div>
            {children}
          </div>
        </div>
      );
    };

    // =========================================================================
    // 5. MOTOR DE SALUD FINANCIERA (HEALTH SCORE DINÁMICO)
    // =========================================================================
    const calculateFinancialHealth = (data) => {
      const currentMonthIncome = data.transactions
        .filter(t => t.type === 'income')
        .reduce((acc, t) => acc + t.amount, 0);

      const currentMonthExpense = data.transactions
        .filter(t => t.type === 'expense')
        .reduce((acc, t) => acc + t.amount, 0);

      const totalSavings = (currentMonthIncome - currentMonthExpense);
      const savingsRate = currentMonthIncome > 0 ? (totalSavings / currentMonthIncome) * 100 : 0;

      // 1. Puntuación Tasa de ahorro (máx 30 puntos)
      let savingsScore = 0;
      if (savingsRate >= 30) savingsScore = 30;
      else if (savingsRate >= 20) savingsScore = 24;
      else if (savingsRate >= 10) savingsScore = 18;
      else if (savingsRate > 0) savingsScore = 10;

      // 2. Fondo de emergencia (máx 25 puntos)
      const emergencyGoal = data.goals.find(g => g.category === 'emergency');
      let emergencyScore = 10;
      if (emergencyGoal && emergencyGoal.target > 0) {
        const ratio = emergencyGoal.current / emergencyGoal.target;
        emergencyScore = Math.min(25, Math.round(ratio * 25));
      }

      // 3. Ratio de Deuda (máx 25 puntos)
      const totalMonthlyDebtPayments = data.debts.reduce((sum, d) => sum + d.monthlyPayment, 0);
      const debtRatio = currentMonthIncome > 0 ? (totalMonthlyDebtPayments / currentMonthIncome) * 100 : 0;
      let debtScore = 25;
      if (debtRatio > 40) debtScore = 5;
      else if (debtRatio > 30) debtScore = 12;
      else if (debtRatio > 15) debtScore = 18;

      // 4. Inversiones y Patrimonio (máx 20 puntos)
      const totalInvested = data.investments.reduce((sum, i) => sum + i.current, 0);
      let investScore = totalInvested > 10000 ? 20 : totalInvested > 3000 ? 15 : totalInvested > 500 ? 10 : 5;

      const totalScore = Math.min(100, Math.max(0, savingsScore + emergencyScore + debtScore + investScore));

      let message = "Tu situación financiera está evolucionando favorablemente.";
      let badge = "Óptima";
      let color = "text-emerald-600";

      if (totalScore < 50) {
        message = "Atención prioritaria: Reduce gastos inmediatos y amortiza deudas con interés elevado.";
        badge = "Vulnerable";
        color = "text-rose-600";
      } else if (totalScore < 75) {
        message = "Vas por buen camino. Reforzar tu fondo de emergencia te dará una protección completa.";
        badge = "Estable";
        color = "text-amber-600";
      }

      return {
        score: totalScore,
        savingsScore,
        emergencyScore,
        debtScore,
        investScore,
        message,
        badge,
        color,
        savingsRate: Math.max(0, savingsRate).toFixed(1)
      };
    };

    // =========================================================================
    // 6. ONBOARDING INTELIGENTE (7 PASOS)
    // =========================================================================
    const OnboardingWizard = ({ onComplete }) => {
      const [step, setStep] = useState(1);
      const [formData, setFormData] = useState({
        situation: 'Quiero ahorrar más y organizar mis cuentas',
        salary: 2600,
        otherIncome: 200,
        housingExpense: 750,
        foodExpense: 380,
        transportExpense: 90,
        leisureExpense: 180,
        subscriptionsExpense: 35,
        currentSavings: 4200,
        hasDebts: 'yes',
        debtType: 'Préstamo coche',
        debtRemaining: 3200,
        debtMonthly: 180,
        debtInterest: 5.9,
        primaryGoalName: 'Crear Fondo de Emergencia',
        primaryGoalAmount: 6000,
        primaryGoalMonths: 12
      });

      const next = () => setStep(s => Math.min(7, s + 1));
      const prev = () => setStep(s => Math.max(1, s - 1));

      const finish = () => {
        if (window.confetti) {
          window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
        }
        onComplete(formData);
      };

      return (
        <div className="min-h-screen bg-slate-50 dark:bg-slate-950 flex flex-col items-center justify-center p-4">
          <div className="w-full max-w-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 md:p-10 shadow-xl relative overflow-hidden">
            {/* Barra superior de progreso */}
            <div className="flex items-center justify-between mb-8">
              <div className="flex items-center gap-2">
                <div className="w-9 h-9 rounded-xl bg-emerald-600 text-white flex items-center justify-center font-bold">
                  <Icon name="sparkles" size={20} />
                </div>
                <span className="font-bold text-slate-900 dark:text-white text-lg">Aura Finance</span>
              </div>
              <span className="text-xs font-semibold px-3 py-1 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-full">
                Paso {step} de 7
              </span>
            </div>

            <div className="w-full bg-slate-100 dark:bg-slate-800 h-1.5 rounded-full mb-8 overflow-hidden">
              <div className="bg-emerald-500 h-full transition-all duration-300" style={{ width: `${(step / 7) * 100}%` }}></div>
            </div>

            {/* Paso 1: Situación actual */}
            {step === 1 && (
              <div>
                <h2 className="text-2xl font-bold text-slate-900 dark:text-white mb-2">Vamos a poner tus finanzas en orden.</h2>
                <p className="text-slate-500 dark:text-slate-400 text-sm mb-6">¿Cuál describe mejor tu prioridad en este momento?</p>
                <div className="space-y-3">
                  {[
                    { label: 'Quiero ahorrar más mes a mes', desc: 'Aumentar mi colchón y reducir fugas de dinero innecesarias' },

            {/* Paso 2: Ingresos mensuales */}

                <div className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1">Salario o nómina neta</label>
                    <div className="relative">
                      <input
                        type="number"
                        className="w-full pl-4 pr-12 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white font-medium"
                        value={formData.salary}
                        onChange={(e) => setFormData({ ...formData, salary: Number(e.target.value) })}

                      <span className="absolute right-4 top-3 text-slate-400 font-medium">€/mes</span>
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1">Otros ingresos o extras (freelance, rentas, etc.)</label>

                      <input
                        type="number"
                        className="w-full pl-4 pr-12 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white font-medium"
                        value={formData.otherIncome}
                        onChange={(e) => setFormData({ ...formData, otherIncome: Number(e.target.value) })}
                      />
                      <span className="absolute right-4 top-3 text-slate-400 font-medium">€/mes</span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Paso 3: Gastos mensuales */}
            {step === 3 && (

                  <div>
                    <label className="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">🏠 Vivienda (Alquiler/Hipoteca)</label>
                    <input
                      type="number"
                      className="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"

                      onChange={(e) => setFormData({ ...formData, housingExpense: Number(e.target.value) })}
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">🍔 Alimentación y supermercado</label>
                    <input
                      type="number"
                      className="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"

                      onChange={(e) => setFormData({ ...formData, foodExpense: Number(e.target.value) })}
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">🚗 Transporte / Combustible</label>
                    <input
                      type="number"
                      className="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"

                      onChange={(e) => setFormData({ ...formData, transportExpense: Number(e.target.value) })}
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">🎮 Ocio y salidas</label>
                    <input
                      type="number"
                      className="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"

              </div>

            {/* Paso 4: Ahorros actuales */}

                      value={formData.primaryGoalMonths}
                      onChange={(e) => setFormData({ ...formData, primaryGoalMonths: Number(e.target.value) })}
                    />
                  </div>
                </div>
              </div>
            )}

            {/* Paso 7: Prioridad y Estrategia Inicial */}
            {step === 7 && (
              <div>
                <h2 className="text-2xl font-bold text-slate-900 dark:text-white mb-2">Tu plan financiero inicial está listo</h2>

                {(() => {
                  const totalInc = Number(formData.salary) + Number(formData.otherIncome);
                  const totalExp = Number(formData.housingExpense) + Number(formData.foodExpense) + Number(formData.transportExpense) + Number(formData.leisureExpense);
                  const margin = Math.max(0, totalInc - totalExp);
                  const monthlyGoalTarget = Math.round(formData.primaryGoalAmount / Math.max(1, formData.primaryGoalMonths));
                  const isFeasible = margin >= monthlyGoalTarget;

                  return (
                    <div className="space-y-4">
                      <div className="p-4 bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-800 rounded-2xl">

                        <p className="text-xs text-emerald-700 dark:text-emerald-400 leading-relaxed">

                        </p>
                      </div>

                      <div className="grid grid-cols-3 gap-3 text-center">
                        <div className="p-3 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700">
                          <p className="text-xs text-slate-400">Ingresos netos</p>
                          <p className="text-base font-bold text-slate-800 dark:text-slate-100">{formatEUR(totalInc)}</p>
                        </div>
                        <div className="p-3 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700">

                        </div>
                        <div className="p-3 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700">
                          <p className="text-xs text-slate-400">Ahorro mensual</p>
                          <p className="text-base font-bold text-emerald-600 dark:text-emerald-400">{formatEUR(margin)}</p>
                        </div>
                      </div>
                    </div>
                  );
                })()}
              </div>
            )}

            {/* Controles de navegación */}
            <div className="flex items-center justify-between mt-8 pt-6 border-t border-slate-100 dark:border-slate-800">
              {step > 1 ? (
                <Button variant="outline" onClick={prev} icon="chevron-left">Atrás</Button>
              ) : <div />}

              {step < 7 ? (
                <Button variant="primary" onClick={next}>
                  Continuar <Icon name="chevron-right" size={16} />
                </Button>
              ) : (
                <Button variant="primary" onClick={finish} icon="rocket">
                  Entrar a mi Dashboard
                </Button>
              )}
            </div>
          </div>
        </div>
      );
    };

    // =========================================================================
    // 8. PANTALLA DE AUTENTICACIÓN (LOGIN / REGISTRO)
    // =========================================================================

            </div>

            {/* Botones de acceso rápido social */}
            <div className="grid grid-cols-2 gap-3 mb-6">
              <button
                type="button"
                onClick={() => onLoginSuccess({ name: 'Alejandro', email: 'google.user@ejemplo.es', plan: 'pro' }, false)}

              >
                <Icon name="globe" size={16} /> Google
              </button>
              <button
                type="button"
                onClick={() => onLoginSuccess({ name: 'Alejandro', email: 'apple.user@ejemplo.es', plan: 'pro' }, false)}
                className="flex items-center justify-center gap-2 py-2.5 px-3 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-semibold hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors"
              >
                <Icon name="smartphone" size={16} /> Apple
              </button>
            </div>

            <div className="flex items-center gap-3 my-4">
              <div className="flex-1 h-px bg-slate-200 dark:bg-slate-800"></div>
              <span className="text-xs text-slate-400 uppercase font-semibold">o con email</span>
              <div className="flex-1 h-px bg-slate-200 dark:bg-slate-800"></div>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              {isRegister && (
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Nombre</label>
                    <input
                      type="text"
                      required
                      className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"

                  <div>
                    <label className="text-xs font-semibold text-slate-700 dark:text-slate-300 block mb-1">Apellidos</label>

                      type="text"

              <div>

                  onChange={(e) => setEmail(e.target.value)}

              <div>

                  <label className="text-xs font-semibold text-slate-700 dark:text-slate-300">Contraseña</label>

                <div className="relative">
                  <input
                    type={showPassword ? 'text' : 'password'}

                    className="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"

                  <button
                    type="button"

            <div className="mt-6 text-center text-xs text-slate-500">

                    Inicia sesión
                  </button>
                </span>
              ) : (
                <span>

                    Crear una cuenta gratis
                  </button>

            <div className="mt-4 text-center">
              <button onClick={onCancel} className="text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
